<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>劉氏工程 報價系統</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F2F2F7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="劉氏報價">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="劉氏報價">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1005/1005141.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1005/1005141.png">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-body: #F2F2F7; --card-bg: rgba(255, 255, 255, 0.95); --text-main: #1C1C1E; --text-muted: #8E8E93;
            --primary: #0A7AFF; --danger: #FF3B30; --border-light: rgba(0, 0, 0, 0.06);
            --radius-xl: 28px; --radius-lg: 20px; --radius-md: 14px;
            --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.04); 
            --shadow-md: 0 16px 40px rgba(0, 0, 0, 0.06), 0 4px 12px rgba(0,0,0,0.03); 
            --shadow-float: 0 30px 60px rgba(0, 0, 0, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-blur: blur(20px);
        }
        
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro TC", "PingFang TC", "Helvetica Neue", "微軟正黑體", sans-serif; -webkit-tap-highlight-color: transparent; font-weight: 800; }
        
        body { 
            background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; 
            height: 100%; min-height: 100vh; width: 100vw; overflow: hidden; position: relative; -webkit-font-smoothing: antialiased; 
            background-image: radial-gradient(circle at top right, #FFFFFF, transparent 500px);
            overscroll-behavior: none;
        }

        html {
            height: 100%;
            /* 確保 html 層級也撐滿，避免 PWA 模式底部安全區域失效 */
        }
        
        #main-scroll-container { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; 
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        
        .container { max-width: 1350px; margin: 0 auto; padding: 24px 16px; padding-bottom: 115px; overflow-x: hidden; } 
        
        .top-nav-wrapper {
            display: flex; justify-content: center; margin-bottom: 24px;
            margin-top: env(safe-area-inset-top); position: relative; z-index: 20;
        }
        
        .nav-tabs { display: flex; background: rgba(255,255,255,0.6); padding: 6px; border-radius: 50px; width: 100%; max-width: 320px; backdrop-filter: var(--glass-blur); border: 1px solid rgba(255,255,255,0.8); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .tab-btn { background: transparent; border: none; padding: 12px 24px; font-size: 1.2rem; font-weight: 900; color: var(--text-muted); border-radius: 40px; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); flex: 1; text-align: center; letter-spacing: 1px; }
        .tab-btn.active { background: #FFFFFF; box-shadow: 0 6px 16px rgba(0,0,0,0.08); color: var(--primary); }
        .hidden { display: none !important; }

        .header { 
            background: linear-gradient(135deg, #1A1A1D, #2B2B32, #000000);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: var(--radius-xl); 
            padding: 35px 24px; 
            margin-bottom: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.25); 
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; gap: 16px; 
            overflow: hidden;
        }
        .header::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: slowSpin 20s linear infinite; pointer-events: none;
        }
        .header::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.08), transparent);
            transform: skewX(-20deg); animation: premiumShine 7s ease-in-out infinite;
        }
        @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes premiumShine { 0%, 100% { left: -100%; } 50% { left: 200%; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .brand-section { display: flex; flex-direction: column; align-items: center; gap: 18px; position: relative; z-index: 10; }
        .brand-section h1 { margin: 0; font-size: 2.5rem; font-weight: 900; color: #F8FAFC; text-align: center; letter-spacing: 4px; text-shadow: 0 4px 16px rgba(0,0,0,0.4); }
        .brand-icon { background: linear-gradient(135deg, #FFDF00, #D4AF37); color: #1C1C1E; width: 75px; height: 75px; border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; box-shadow: 0 10px 30px rgba(212,175,55,0.4); cursor: pointer; transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); border: 2px solid rgba(255,255,255,0.6); position: relative; }
        .brand-icon::after {
            content: ''; position: absolute; inset: -5px; border-radius: inherit; border: 2px solid rgba(212,175,55,0.6);
            animation: pulseGlow 2.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes pulseGlow { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.15); opacity: 0; } }
        .brand-icon:active { transform: scale(0.9); }

        .animate-card { animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }

        #floating-cart {
            position: fixed; top: max(20px, env(safe-area-inset-top)); right: 20px;
            background: #1C1C1E; color: white;
            width: 50px; height: 50px; border-radius: 25px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; z-index: 1400; cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid rgba(255,255,255,0.4); backdrop-filter: blur(8px);
        }
        #floating-cart::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: spinGlowCart 3s linear infinite; z-index: -1;
            opacity: 1; transition: opacity 0.4s;
        }
        #floating-cart:hover { transform: scale(1.08); background: #000000; }
        #floating-cart.idle { opacity: 0.35; box-shadow: none; border-color: rgba(255,255,255,0.2); transform: scale(0.95); }
        #floating-cart.idle::before { opacity: 0; animation: none; }
        #floating-cart.idle:hover { opacity: 1; transform: scale(1.05); }

        #cart-badge {
            position: absolute; top: -6px; right: -4px;
            background: var(--danger); color: white; font-size: 0.9rem; font-weight: 900;
            width: 24px; height: 24px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid white; box-shadow: 0 4px 10px rgba(255,59,48,0.4);
            transition: transform 0.2s;
        }

        .top-action-bar { display: flex; justify-content: flex-end; gap: 14px; margin-bottom: 24px; padding: 0 8px; }
        .top-action-btn { 
            padding: 12px 20px; font-size: 1.05rem; font-weight: 900; border-radius: 50px; 
            border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; 
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 6px 16px rgba(0,0,0,0.06); 
            backdrop-filter: var(--glass-blur); background: var(--glass-bg);
        }
        .top-action-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 10px 24px rgba(0,0,0,0.1); }
        .top-action-btn:active { transform: translateY(1px) scale(0.97); }
        .btn-history { color: var(--primary); border: 2px solid rgba(10,122,255,0.2); }
        .btn-history:hover { border-color: var(--primary); background: #EBF4FF; }
        .btn-clear { color: var(--danger); border: 2px solid rgba(255,59,48,0.2); }
        .btn-clear:hover { border-color: var(--danger); background: #FFEEEE; }

        .card { background: var(--card-bg); border-radius: var(--radius-xl); padding: 40px; margin-bottom: 32px; box-shadow: var(--shadow-md); border: 1px solid rgba(255,255,255,0.9); backdrop-filter: var(--glass-blur); }
        .card-title { margin-top: 0; margin-bottom: 30px; font-size: 1.9rem; font-weight: 900; color: var(--text-main); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; letter-spacing: 1px; }
        .card-title i { color: var(--primary); font-size: 2.2rem; text-shadow: 0 4px 12px rgba(10,122,255,0.2); }
        .form-group label { display: block; font-size: 1.35rem; font-weight: 900; color: #3A3A3C; margin-bottom: 14px; }
        
        input[type="text"], input[type="number"]:not(.qty-input-center), select { width: 100%; padding: 22px; font-size: 1.35rem; border: 2px solid rgba(0,0,0,0.08); border-radius: var(--radius-md); background: #F9F9FB; color: var(--text-main); font-weight: 900; transition: all 0.3s ease; box-shadow: inset 0 2px 8px rgba(0,0,0,0.02); }
        input[type="text"]:focus, select:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 6px rgba(10, 122, 255, 0.15); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .switch { position: relative; display: inline-block; width: 56px; height: 32px; min-width: 56px; min-height: 32px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #E5E5EA; transition: .4s; border-radius: 34px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.1); }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 4px; bottom: 4px; background-color: white; transition: .4s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 50%; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        input:checked + .slider { background-color: #34C759; }
        input:checked + .slider:before { transform: translateX(24px); }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .cat-btn { background: #FFFFFF; border: 2px solid var(--border-light); border-radius: var(--radius-lg); padding: 22px 10px; text-align: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .cat-btn::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%); pointer-events: none; }
        .cat-btn i { font-size: 2.6rem; transition: transform 0.3s; filter: drop-shadow(0 6px 8px rgba(0,0,0,0.1)); }
        .cat-btn span { font-size: 1.2rem; font-weight: 900; letter-spacing: 0.5px; }
        .cat-btn:hover { transform: translateY(-8px) scale(1.03); box-shadow: 0 20px 40px rgba(0,0,0,0.08); border-color: transparent !important; }
        .cat-btn:active { transform: translateY(0) scale(0.98); }

        .table-responsive-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 16px; border-radius: var(--radius-lg); }
        .table-responsive-wrapper::-webkit-scrollbar { height: 10px; }
        .table-responsive-wrapper::-webkit-scrollbar-track { background: #F2F2F7; border-radius: 10px; }
        .table-responsive-wrapper::-webkit-scrollbar-thumb { background: #C7C7CC; border-radius: 10px; border: 2px solid #F2F2F7; }
        .quote-table { min-width: 1050px; width: 100%; border-collapse: separate; border-spacing: 0; }
        
        .global-header-row { display: grid; grid-template-columns: 2fr 1.2fr 1.6fr 1.1fr 1.3fr 1.5fr 70px; gap: 14px; padding: 22px 24px; background: #F2F2F7; border-radius: var(--radius-md); font-weight: 900; color: #3A3A3C; font-size: 1.3rem; align-items: center; text-align: center; margin-bottom: 20px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.04); }
        .global-header-row > div:first-child { text-align: left; }
        .global-header-row > div:nth-child(6) { text-align: right; }
        
        .category-header { padding: 24px 32px; margin-top: 40px; margin-bottom: 16px; border-radius: var(--radius-md); font-weight: 900; font-size: 1.9rem; color: #FFFFFF; display: flex; align-items: center; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); letter-spacing: 2px; }
        
        .quote-item-row { display: grid; grid-template-columns: 2fr 1.2fr 1.6fr 1.1fr 1.3fr 1.5fr 70px; gap: 14px; align-items: center; padding: 24px; border-radius: var(--radius-md); margin-bottom: 14px; border: 1px solid rgba(0,0,0,0.05); transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); animation: slideIn 0.4s ease forwards; background: #FFFFFF; }
        .quote-item-row:hover { transform: scale(1.01) translateY(-2px); box-shadow: 0 12px 35px rgba(0,0,0,0.08); border-color: rgba(0,0,0,0.1); z-index: 10; }
        .item-name { font-size: 1.55rem; font-weight: 900; color: var(--text-main); line-height: 1.5; word-break: break-all; }
        
        .qty-control-group, .input-wrapper { display: flex; align-items: center; background: #F2F2F7; border-radius: 16px; border: 2px solid rgba(0,0,0,0.05); overflow: hidden; height: 64px; width: 100%; transition: all 0.3s ease; box-shadow: inset 0 2px 6px rgba(0,0,0,0.02); }
        .qty-control-group:focus-within, .input-wrapper:focus-within { border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 5px rgba(10, 122, 255, 0.15); }
        .qty-control-group input, .input-wrapper input { flex: 1; width: 100%; min-width: 40px; height: 100%; border: none !important; background: transparent !important; box-shadow: none !important; text-align: center; padding: 0 4px !important; font-size: 1.45rem !important; font-weight: 900 !important; color: var(--text-main) !important; }

        .qty-btn { width: 48px; flex-shrink: 0; height: 100%; background: transparent; border: none; color: #3A3A3C; font-size: 1.6rem; font-weight: 900; cursor: pointer; transition: background 0.2s, color 0.2s; }
        .qty-btn:active { background: rgba(0,0,0,0.1); }
        .qty-btn:hover { background: rgba(0,0,0,0.05); color: var(--primary); }
        
        .unit-box { flex-shrink: 0; padding-right: 12px; display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
        .unit-box span { font-weight: 900; color: #8E8E93; font-size: 1.25rem; white-space: nowrap; }
        .unit-box button { width: 38px; height: 38px; border-radius: 12px; border: none; background: rgba(0,0,0,0.05); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .unit-box button:hover { background: rgba(0,0,0,0.1); transform: scale(1.05); }

        .input-wrapper.discount-box { background: #FFF0F0; border: 2px solid rgba(255,59,48,0.2); }
        .input-wrapper.discount-box:focus-within { border-color: var(--danger); box-shadow: 0 0 0 5px rgba(255, 59, 48, 0.15); background: #FFFFFF; }
        .input-wrapper.discount-box input, .input-wrapper.discount-box .unit-box span { color: var(--danger) !important; }

        .subtotal-display { text-align: right; font-size: 1.9rem; font-weight: 900; color: var(--text-main); font-family: "Arial", sans-serif; letter-spacing: -0.5px; }
        .delete-btn { flex-shrink: 0; background: rgba(255, 59, 48, 0.08); color: var(--danger); width: 64px; height: 64px; border-radius: 18px; display: flex; align-items: center; justify-content: center; border: none; font-size: 1.8rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); margin: 0 auto; }
        .delete-btn:hover { background: var(--danger); color: white; transform: scale(1.1); box-shadow: 0 8px 20px rgba(255,59,48,0.3); }

        /* 全域底部導覽列：使用 fixed + 獨立合成層，完全隔離於內容排版之外 */
        .bottom-bar-fixed {
            position: fixed;
            bottom: 0; 
            left: 0; 
            right: 0; 
            width: 100%;
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(40px); 
            -webkit-backdrop-filter: blur(40px);
            border-top: 1px solid rgba(0,0,0,0.05); 
            z-index: 1500;
            /* 核心修正：用 padding-bottom 吸收 iOS/Android PWA 的底部安全區域
               使用 max() 確保 PWA standalone 模式下 env() 正確生效 */
            padding-bottom: max(env(safe-area-inset-bottom, 0px), 0px);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.06);
            /* 強制獨立 GPU 合成層，防止任何子元素動畫觸發父層重排 */
            isolation: isolate;
            contain: layout style;
            transform: translate3d(0, 0, 0);
            -webkit-transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }
        
        .bottom-bar-inner {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 28px;
            min-height: 75px;
        }

        .bottom-left { display: flex; justify-content: flex-start; gap: 16px; align-items: center; margin-bottom: 0; height: 100%; }
        
        .bottom-center { 
            flex: 1; display: flex; flex-direction: row; justify-content: flex-end; align-items: center;
            gap: 24px; margin-bottom: 0; padding-right: 15px;
        }

        .action-btn-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; margin-bottom: 0; }
        .action-btn-label { font-size: 0.9rem; font-weight: 900; color: #8E8E93; line-height: 1; letter-spacing: 0.5px; margin-top: 0; }

        .bottom-total-label { font-size: 1.9rem; color: #1C1C1E; font-weight: 900; letter-spacing: 2px; margin: 0; }
        
        .bottom-total-amount { 
            font-size: 3.8rem; font-weight: 900; color: #FF3B30; 
            letter-spacing: -1px; font-family: "Arial", sans-serif; 
            display: flex; align-items: baseline; gap: 10px; line-height: 1; 
            /* 移除 transition: transform，改用 color 動畫避免觸發 layout */
            transition: color 0.2s; margin: 0; text-shadow: 0 4px 12px rgba(255,59,48,0.15);
            /* 金額文字獨立合成層，動畫不影響父層位置 */
            will-change: color;
            transform: translateZ(0);
            contain: layout;
        }
        /* 關鍵修正：動畫改為只變色，完全不使用 transform: scale()
           scale 會觸發 reflow 並向上傳播，導致 fixed 底部導覽列跳動 */
        .bottom-total-amount.updated { animation: popInTotal 0.45s ease-out; }
        @keyframes popInTotal { 
            0% { color: #FF3B30; } 
            30% { color: #0A7AFF; } 
            100% { color: #FF3B30; } 
        }

        .bottom-total-amount .currency { font-size: 1.7rem; color: #8E8E93; font-weight: 900; filter: none; letter-spacing: 0; margin-bottom: 4px; text-shadow: none; }
        
        .action-circle-btn { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }
        .btn-png { background: linear-gradient(135deg, #0A7AFF, #0056b3); color: white; border: 2px solid rgba(255,255,255,0.4); }
        .btn-png:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 10px 24px rgba(10,122,255,0.4); }
        .btn-excel { background: linear-gradient(135deg, #34C759, #248a3d); color: white; border: 2px solid rgba(255,255,255,0.4); }
        .btn-excel:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 10px 24px rgba(52,199,89,0.4); }

        #scrollTopBtn {
            position: fixed; bottom: 130px; right: 28px; width: 54px; height: 54px; border-radius: 27px; background: rgba(10, 122, 255, 0.9); color: white; border: 2px solid rgba(255,255,255,0.5); font-size: 1.5rem; display: flex; align-items: center; justify-content: center; z-index: 1400; opacity: 0; pointer-events: none; transform: translateY(20px); transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); box-shadow: 0 8px 24px rgba(0,0,0,0.2); backdrop-filter: blur(8px); cursor: pointer;
        }
        #scrollTopBtn.visible { opacity: 0.95; pointer-events: auto; transform: translateY(0); }
        #scrollTopBtn.visible.idle { opacity: 0.35; box-shadow: none; border-color: rgba(255,255,255,0.2); }
        #scrollTopBtn.visible:hover { opacity: 1; transform: translateY(-5px) scale(1.08); background: #0A7AFF; box-shadow: 0 12px 30px rgba(10,122,255,0.4); }

        /* ================================================================
           UI v3：iOS 液態玻璃 × 高級質感層（僅外觀/動畫，不影響功能）
           大圓角、霧面玻璃、內側高光、層次陰影、清楚的按鈕階層
           ================================================================ */
        :root {
            --bg-body: #E6EBF5; --text-main: #14171F; --text-muted: #6A7387;
            --primary: #0A84FF; --indigo: #5E5CE6; --danger: #FF375F; --ok: #30B66E; --accent: #E8B04A; --graphite: #151925; --graphite-2: #1F2433;
            --radius-xl: 30px; --radius-lg: 24px; --radius-md: 18px;
            --glass: rgba(255,255,255,.62); --glass-strong: rgba(255,255,255,.78); --glass-border: rgba(255,255,255,.75);
            --hair: rgba(20,23,31,.08);
            --hi: inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(20,23,31,.04);
            --shadow-sm: 0 1px 2px rgba(20,23,31,.05), 0 6px 16px rgba(20,23,31,.06);
            --shadow-md: 0 2px 6px rgba(20,23,31,.05), 0 18px 44px rgba(52,70,120,.14);
            --shadow-float: 0 40px 90px rgba(20,23,31,.38);
            --ease: cubic-bezier(.22,1,.36,1);
            --blur: blur(26px) saturate(180%);
        }
        * { font-weight: 700; }
        body {
            background-color: var(--bg-body);
            background-image: radial-gradient(800px 520px at 90% -60px, rgba(94,92,230,.28), transparent 70%),
                              radial-gradient(760px 520px at -8% 12%, rgba(10,132,255,.24), transparent 70%),
                              radial-gradient(700px 500px at 60% 105%, rgba(48,182,110,.14), transparent 70%);
            background-attachment: fixed;
            font-variant-numeric: tabular-nums;
        }
        @keyframes rise { from { opacity: 0; transform: translate3d(0,16px,0) scale(.985); } to { opacity: 1; transform: none; } }
        .animate-card { animation: rise .6s var(--ease) both; }
        .delay-1 { animation-delay: .06s; } .delay-2 { animation-delay: .12s; } .delay-3 { animation-delay: .18s; }
        .quote-item-row { animation: rise .4s var(--ease) both; }
        .modal-overlay.active .modal-content { animation: rise .4s var(--ease) both; }

        /* ── 導覽：膠囊玻璃分段控制 ── */
        .nav-tabs { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--glass-border); box-shadow: var(--shadow-sm), var(--hi); border-radius: 999px; padding: 4px; }
        .tab-btn { border-radius: 999px; font-weight: 800; transition: all .3s var(--ease); }
        .tab-btn.active { background: linear-gradient(180deg, #2B3045, var(--graphite)) !important; color: #fff !important; box-shadow: 0 6px 16px rgba(20,23,31,.3), inset 0 1px 0 rgba(255,255,255,.18) !important; }

        /* ── 標頭：石墨玻璃 + 頂部高光 ── */
        .header { background: radial-gradient(480px 200px at 88% -10%, rgba(94,92,230,.6), transparent 70%), radial-gradient(380px 180px at 5% 110%, rgba(10,132,255,.45), transparent 70%), linear-gradient(145deg, #1B2033, var(--graphite)) !important;
                  border: 1px solid rgba(255,255,255,.12) !important; border-radius: var(--radius-xl); box-shadow: 0 24px 56px rgba(20,23,31,.3), inset 0 1px 0 rgba(255,255,255,.16); position: relative; overflow: hidden; }
        .header::before { content: ""; position: absolute; inset: 0; width: auto; height: auto; transform: none; border-radius: 0; animation: none; opacity: 1; background: linear-gradient(180deg, rgba(255,255,255,.12), transparent 42%); }
        .header::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; top: auto; width: auto; height: 1px; transform: none; border-radius: 0; animation: none; opacity: 1; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); }
        .brand-section h1 { font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #fff, #C9D6F2); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; text-shadow: none; }
        .brand-icon { background: linear-gradient(145deg, #F6D58B, var(--accent)) !important; border-radius: 22px; box-shadow: 0 10px 26px rgba(232,176,74,.45), inset 0 1px 0 rgba(255,255,255,.6) !important; }
        .brand-icon::after { animation: none !important; }

        /* ── 卡片：霧面玻璃 ── */
        .card { background: var(--glass); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); border: 1px solid var(--glass-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-md), var(--hi); position: relative; }
        .card::before { content: none; }
        .card-title { font-weight: 900; letter-spacing: .5px; padding-bottom: 16px; border-bottom: 1px solid var(--hair); gap: 14px; }
        .card-title i { width: 42px; height: 42px; display: inline-flex !important; align-items: center; justify-content: center; border-radius: 14px; font-size: 1.15rem !important; color: #fff !important; -webkit-text-fill-color: #fff; text-shadow: none; background: linear-gradient(145deg, #3DA0FF, var(--indigo)); box-shadow: 0 6px 14px rgba(10,132,255,.35), inset 0 1px 0 rgba(255,255,255,.4); flex-shrink: 0; }
        .form-group label { color: #2A3144; font-weight: 800; }

        /* ── 表單：凹槽式欄位 ── */
        input[type="text"], input[type="number"]:not(.qty-input-center), select { background: rgba(255,255,255,.7); border: 1px solid rgba(20,23,31,.1); border-radius: 16px; box-shadow: inset 0 1px 3px rgba(20,23,31,.06); font-weight: 700; transition: border-color .2s, box-shadow .2s, background .2s; }
        input[type="text"]:hover, select:hover { border-color: rgba(10,132,255,.4); }
        input[type="text"]:focus, select:focus { border-color: var(--primary); background: #fff; box-shadow: 0 0 0 4px rgba(10,132,255,.18); }
        input:checked + .slider { background: var(--ok); }
        .slider { border-radius: 999px; }

        /* ── 按鈕階層：玻璃次要 / 漸層主要 ── */
        .top-action-btn, .btn-text, .action-circle-btn, .cat-btn, .delete-btn, .qty-btn { transition: transform .3s var(--ease), box-shadow .3s var(--ease), background .2s, color .2s, border-color .2s; }
        .top-action-btn:active, .btn-text:active, .action-circle-btn:active, .cat-btn:active, .delete-btn:active, .qty-btn:active { transform: scale(.95); }
        .top-action-btn { border-radius: 999px; background: var(--glass-strong); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--shadow-sm), var(--hi); font-weight: 800; border: 1px solid var(--glass-border); }
        .btn-history { color: var(--primary); }
        .btn-clear { color: var(--danger); }
        .top-action-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(52,70,120,.18), var(--hi); }
        .btn-text { border-radius: 16px; font-weight: 800; box-shadow: var(--shadow-sm), var(--hi); }

        /* ── 工程類別：玻璃磚 ── */
        .cat-btn { background: rgba(255,255,255,.7); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm), var(--hi); }
        .cat-btn:hover { transform: translateY(-4px); border-color: rgba(10,132,255,.45); box-shadow: 0 16px 34px rgba(10,132,255,.2), var(--hi); }

            let iconIndex = hash % fallbackIcons.length;
            match = { icon: fallbackIcons[iconIndex], h: hash % 360, s: 55, l: 55 }; 
        }
        return { 
            bg: `hsl(${match.h}, ${match.s}%, ${match.l}%)`, 
            rowEven: `#FFFFFF`, 
            rowOdd: `hsla(${match.h}, ${match.s}%, 88%, 0.6)`,

    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function calcSubtotal(q, db) { return Math.max(0, Math.round((q.price || 0) * (q.qty || 0) * (db && db.hasDays ? (q.days || 1) : 1)) - (q.discount || 0)); }

    const UNIT_GROUP_FACTORS = [
        { '毫米': 0.1, '公分': 1, '公尺': 100, '公里': 100000, '台尺': 30.3, '尺': 30.3, '台寸': 3.03, '寸': 3.03, '英吋': 2.54, '吋': 2.54, '英呎': 30.48, '呎': 30.48, '碼': 91.44 },

    ];
    function findUnitInfo(unitStr) {
        if (!unitStr) return null;
        const u = String(unitStr).trim();
        for (let i = 0; i < UNIT_GROUP_FACTORS.length; i++) {
            if (Object.prototype.hasOwnProperty.call(UNIT_GROUP_FACTORS[i], u)) return { groupIndex: i, factor: UNIT_GROUP_FACTORS[i][u] };
        }
        return null;
    }
    function getConversionRatio(fromUnit, toUnit) {
        const from = findUnitInfo(fromUnit), to = findUnitInfo(toUnit);
        if (!from || !to || from.groupIndex !== to.groupIndex) return null;

    function getUnitConvertOptions(currentUnit) {

    function getItemUnit(q, db) {

    // 數字轉中文大寫金額（壹貳參…，含「零」的正確補位規則）
    // 估算文字在指定欄寬（以半形字元計）內會折成幾行：中文字算 2 格，保留使用者的手動換行
    function estTextLines(text, widthChars) {
        return String(text || '').split(/\r?\n/).reduce((n, ln) => {
            let w = 0; for (const ch of ln) w += ch.charCodeAt(0) > 255 ? 2 : 1;
            return n + Math.max(1, Math.ceil(w / widthChars));
        }, 0);
    }
    function numberToChineseUpper(num) {
        num = Math.round(Math.max(0, Number(num) || 0));
        if (num === 0) return '零';
        const digits = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖'];
        const units = ['', '拾', '佰', '仟'];
        const bigUnits = ['', '萬', '億', '兆', '京'];
        const str = String(num);
        const groups = [];
        for (let e = str.length; e > 0; e -= 4) groups.unshift(str.slice(Math.max(0, e - 4), e));
        let result = '';
        let pendingZero = false;
        groups.forEach((g, gi) => {
            const bigIdx = groups.length - 1 - gi;
            if (/^0+$/.test(g)) { if (result) pendingZero = true; return; }
            let part = '';
            let zero = false;
            for (let i = 0; i < g.length; i++) {
                const d = parseInt(g[i], 10), u = g.length - 1 - i;
                if (d === 0) { zero = true; continue; }
                if (zero && part) part += '零';
                zero = false;
                part += digits[d] + units[u];
            }
            // 前一段為 0 或本段不足四位（開頭有 0）需補「零」
            if (result && (pendingZero || g.length < 4 || g[0] === '0')) result += '零';
            pendingZero = false;
            result += part + bigUnits[bigIdx];
        });
        return result;
    }

    //        在它「新增歷史報價」時就會把舊的項目清單連同歷史一起寫回，造成回朔。
    //  新版：所有寫入一律走 mutateDB()：在 Firestore 交易中「先讀取雲端最新資料 →

    let categoriesDirty = false;   // 分類順序/新增尚未按「儲存變更」

    function readState(data) {
        const items = Array.isArray(data.items) ? data.items : [];
        return {
            items,
            history: Array.isArray(data.history) ? data.history : [],
            categories: Array.isArray(data.categories) ? data.categories : Array.from(new Set(items.map(i => i.category))),
            settings: Object.assign({ defaultShowTitle: true, allowDuplicateItems: false }, (data.settings && typeof data.settings === 'object') ? data.settings : {}),

    function applyState(st) {
        engineeringDB = st.items;

    function todayKey() {
        const d = new Date();
        return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;
    }

    // mutator(state) 直接修改 state；回傳 ABORT 代表不寫入。回傳 { state }。
    // 【修正②】交易內只讀寫 current_db；每日備份移到交易成功之後、獨立且「盡力而為」，
    //          即使 Firestore 安全規則不允許 backup_* 文件，也不會再讓存檔／匯出失敗。
    window.mutateDB = async function(mutator) {
        let finalState = null;
        let backupData = null;
        await runTransaction(db, async (tx) => {
            backupData = null;
            const snap = await tx.get(dbRef);
            const exists = snap.exists();
            const rawState = exists ? readState(clone(snap.data())) : readState(clone({ items: defaultDB }));
            const state = clone(rawState);
            const outcome = mutator(state);
            finalState = state;
            if (outcome === ABORT) return;

            const changed = {};
            if (!exists) {
                Object.assign(changed, state);
            } else {
                for (const k of Object.keys(state)) {
                    if (JSON.stringify(state[k]) !== JSON.stringify(rawState[k])) changed[k] = state[k];
                }
            }
            if (Object.keys(changed).length === 0) return;

            // 每日自動備份資料（僅項目/分類/外觀，不含歷史），交易成功後才寫入
            if (exists && (changed.items || changed.categories || changed.categorySettings)) {
                backupData = {
                    savedAt: new Date().toISOString(),
                    items: rawState.items,
                    categories: rawState.categories,
                    categorySettings: rawState.categorySettings
                };
            }
            tx.set(dbRef, changed, { merge: true });
        });
        applyState(finalState);

        if (backupData) {
            (async () => {
                try {
                    const backupRef = doc(db, "su_system", "backup_" + todayKey());
                    if (!(await getDoc(backupRef)).exists()) await setDoc(backupRef, backupData);
                } catch (e) {
                    console.warn("每日備份未寫入（可能是 Firestore 安全規則未開放 backup_* 文件）：", e);
                }
            })();
        }
        return { state: finalState };
    };

    // 【修正③】顯示真正的錯誤代碼與原因，不再一律說「請確認網路」
    function safeMutate(mutator, failMsg) {
        return window.mutateDB(mutator).catch(err => {

                'unavailable': '連不上 Firebase（網路、VPN、廣告阻擋或防火牆）',
                'invalid-argument': '資料格式錯誤或文件超過 1MiB 上限',
                'resource-exhausted': '額度用盡或請求過大',
                'aborted': '多裝置同時寫入衝突，請再試一次',
                'unauthenticated': '未通過驗證',

    window.recordQuoteHistory = async function() {
        const clientName = document.getElementById('client-name-input').value.trim();

        const d = new Date();
        const dateStr = getFormattedDateString2(d);

        const projectName = document.getElementById('project-name-input').value.trim();
        const taxExcluded = document.getElementById('tax-excluded-cb').checked;

        const mappedItems = quoteList.map(q => {
            const dbItem = engineeringDB.find(db => db.id === q.dbId);

                cat: dbItem ? dbItem.category : '', name: dbItem ? dbItem.name : '未知',
                price: q.price, qty: q.qty, unit: getItemUnit(q, dbItem),
                days: dbItem && dbItem.hasDays ? q.days : null, discount: q.discount || 0,

            return m;
        });

        let result = null;
        const r = await safeMutate((state) => {
            result = null;
            const hist = state.history;
            if (hist.length > 0) {
                const last = hist[0];
                if (last.client === clientName && last.total === total
                    && (last.clientAddress || '') === clientAddress && (last.clientTaxId || '') === clientTaxId
                    && (last.projectName || '') === projectName && !!last.taxExcluded === taxExcluded
                    && JSON.stringify(last.items) === JSON.stringify(mappedItems)) {
                    result = { status: 'duplicate', quoteNo: last.quoteNo || `${todayNoStr}001` };
                    return ABORT;
                }
            }
            let maxNum = 0;
            hist.forEach(h => {
                if (h.quoteNo && h.quoteNo.startsWith(todayNoStr)) {
                    const n = parseInt(h.quoteNo.replace(todayNoStr, '').replace('-', ''));
                    if (!isNaN(n) && n > maxNum) maxNum = n;

            const quoteNo = `${todayNoStr}${String(maxNum + 1).padStart(3, '0')}`;

                id: 'R_' + Date.now(), quoteNo, date: dateStr, time: timeStr,
                client: clientName, clientAddress, clientTaxId, projectName, taxExcluded,

            if(m !== 'all' && parts[1] !== m) return false;
            return true;
        });
    };

    // 歷史明細轉成圖片顯示（與 PNG 結果畫面相同：長按圖片即可儲存/分享；電腦版可按鈕下載）
    let historyImgToken = 0;
    function renderHistoryDetailAsImage(record, detailHtml) {
        const host = document.getElementById('history-detail-content');
        const token = ++historyImgToken;
        const stage = (function () {
            let el = document.getElementById('history-capture-stage');
            if (!el) { el = document.createElement('div'); el.id = 'history-capture-stage'; document.body.appendChild(el); }
            return el;
        })();
        const showFallback = (msg) => {
            if (token !== historyImgToken) return;
            stage.innerHTML = '';
            host.innerHTML = `<div style="padding:12px 16px 0; color:#8E8E93; font-weight:800; font-size:1rem;">${msg}</div>` + detailHtml;
        };
        if (typeof html2canvas !== 'function') return showFallback('圖片元件尚未載入，已顯示文字明細（可自行截圖保存）。');

        host.innerHTML = '<div style="padding:70px 20px; text-align:center; color:#8E8E93; font-weight:900; font-size:1.15rem;"><i class="fas fa-spinner fa-spin" style="font-size:2rem; display:block; margin-bottom:14px; color:var(--primary);"></i>正在產生可長按儲存的圖片…</div>';
        stage.innerHTML = detailHtml;

        setTimeout(() => {
            if (token !== historyImgToken) return;
            const w = stage.offsetWidth || 900, h = stage.offsetHeight || 1200;
            const scale = Math.max(0.5, Math.min(2, Math.sqrt(12000000 / (w * h))));   // 手機畫布像素上限保護
            Promise.race([
                html2canvas(stage, { scale, backgroundColor: '#ffffff', useCORS: true, logging: false, scrollX: 0, scrollY: 0 }),
                new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 30000))
            ]).then(canvas => {
                if (token !== historyImgToken) return;
                const url = canvas.toDataURL('image/png');
                stage.innerHTML = '';
                host.innerHTML = `
                    <div style="padding:16px; text-align:center;">
                        <div style="margin-bottom:12px; font-weight:900; font-size:1.05rem; color:var(--primary);"><i class="fas fa-hand-pointer"></i> 長按下方圖片即可儲存／分享</div>
                        <img id="history-detail-img" src="${url}" alt="報價明細圖片" style="width:100%; height:auto; display:block; border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.12); -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;">
                        <button type="button" id="history-detail-dl" class="btn-text" style="margin-top:16px; background:var(--text-main); color:#fff; padding:14px 26px; font-size:1.15rem;"><i class="fas fa-download"></i> 下載圖片（電腦版）</button>
                    </div>`;
                const dl = document.getElementById('history-detail-dl');
                if (dl) dl.onclick = () => {
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${record.quoteNo || 'quote'}_${record.client || ''}`.replace(/[\\\/:*?"<>|]/g, '_') + '.png';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                };
            }).catch(() => showFallback('圖片產生失敗，已顯示文字明細（可自行截圖保存）。'));
        }, 80);
    }

            let itemsHtml = r.items.map(i => {
                const amt = hasAmount(i.price);
                let sub = calcHistSubtotal(i);
                let optText = [];
                if(amt && i.days) optText.push(`${i.days}天`);
                if(amt && i.discount > 0) optText.push(`折抵$${i.discount}`);
                let optTag = optText.length > 0 ? `<span style="color:var(--text-muted); font-size:1.1rem; margin-left:10px;">(${optText.join(', ')})</span>` : '';
                
                let unitDisplay = i.hideUnit || !i.unit ? '' : i.unit;

                <div class="history-item-row">

                    ${amt ? `<span>$${sub.toLocaleString()}</span>` : ''}
                </div>`;
            }).join('');

            let delBtn = isAdmin ? `<button onclick="deleteHistoryRecord('${r.id}')" style="background:rgba(255,59,48,0.1); color:var(--danger); border:none; padding:12px 20px; border-radius:14px; cursor:pointer; font-weight:900; transition:all 0.3s; font-size:1.15rem;"><i class="fas fa-trash"></i> 刪除</button>` : '';
            let quoteBadge = r.quoteNo ? `<span style="margin-left:12px; padding:6px 12px; background:var(--primary); color:white; border-radius:10px; font-size:1.1rem; box-shadow:0 2px 8px rgba(10,122,255,0.3);">#${r.quoteNo}</span>` : '';

            return `
            <div class="history-card">
                <div class="history-card-header">
                    <div>
                        <div class="history-client"><i class="fas fa-user-circle" style="color:var(--primary); margin-right:14px; font-size:2.2rem;"></i>${esc(r.client)}</div>
                        <div class="history-time">${r.date} ${r.time} ${quoteBadge}</div>
                    </div>
                    <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end;">
                        <div class="history-total">$${r.total.toLocaleString()}</div>
                        <div style="display:flex; gap: 10px; margin-top: 14px;">
                            <button onclick="openHistoryDetail('${r.id}')" style="background:#EBF4FF; color:var(--primary); border:2px solid rgba(10,122,255,0.2); padding:12px 20px; border-radius:14px; cursor:pointer; font-weight:900; font-size:1.15rem; transition:all 0.3s;">
                                <i class="fas fa-plus"></i> 詳細明細
                            </button>
                            ${delBtn}
                        </div>
                    </div>
                </div>
                <div>${itemsHtml}</div>
            </div>`;
        }).join('');
    };

    window.renderHistoryList = function() { document.getElementById('history-list-container').innerHTML = buildHistoryHTML(filterHistoryData('history-year', 'history-month'), false); };
    window.renderAdminHistoryList = function() { document.getElementById('admin-history-list-container').innerHTML = buildHistoryHTML(filterHistoryData('admin-history-year', 'admin-history-month'), true); };

    window.deleteHistoryRecord = async function(id) {
        if(!confirm('【安全警告】確定要刪除此筆報價紀錄？')) return;
        if(!confirm('【二次確認】刪除後將無法還原，請最後確認是否執行刪除？')) return;
        const r = await safeMutate((state) => { state.history = state.history.filter(x => x.id !== id); });

    window.exportHistoryToExcel = async function() {
        if(quoteHistory.length === 0) return alert('目前無歷史紀錄可匯出！');
        
        const workbook = new ExcelJS.Workbook();
        
        const groupedRecords = {};
        quoteHistory.forEach(record => {
            const ym = record.date.substring(0, 7); 
            if (!groupedRecords[ym]) groupedRecords[ym] = [];
            groupedRecords[ym].push(record);
        });

        for (const [ym, records] of Object.entries(groupedRecords)) {
            const ws = workbook.addWorksheet(ym + ' 歷史報價');
            
            ws.columns = [
                { header: '報價單號', key: 'quoteNo', width: 18 },
                { header: '日期', key: 'date', width: 14 },
                { header: '時間', key: 'time', width: 12 },
                { header: '客戶名稱', key: 'client', width: 18 },
                { header: '總金額', key: 'total', width: 15 },
                { header: '類別', key: 'cat', width: 18 },
                { header: '項目名稱', key: 'name', width: 35 },
                { header: '單價', key: 'price', width: 12 },
                { header: '數量', key: 'qty', width: 10 },
                { header: '單位', key: 'unit', width: 10 },
                { header: '天數', key: 'days', width: 10 },
                { header: '折抵', key: 'discount', width: 12 },
                { header: '備註', key: 'remark', width: 40 },
                { header: '客戶地址', key: 'addr', width: 32 },
                { header: '統一編號', key: 'taxid', width: 14 },
                { header: '工程名稱', key: 'proj', width: 26 },
                { header: '稅別', key: 'tax', width: 10 }
            ];
            
            ws.getRow(1).eachCell(cell => {
                cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C1C1E' } };
                cell.alignment = { vertical: 'middle', horizontal: 'center' };
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
            });
            ws.getRow(1).height = 25;
            
            let isAltRecord = false;
            records.forEach(record => {
                const recordBgColor = isAltRecord ? 'FFF2F2F7' : 'FFFFFFFF';
                isAltRecord = !isAltRecord;
                
                record.items.forEach((item, index) => {
                    const row = ws.addRow({
                        quoteNo: index === 0 ? record.quoteNo : '',
                        date: index === 0 ? record.date : '',
                        time: index === 0 ? record.time : '',
                        client: index === 0 ? record.client : '',
                        total: index === 0 ? record.total : '',
                        cat: item.cat,
                        name: item.name,
                        price: hasAmount(item.price) ? item.price : '',
                        qty: hasAmount(item.price) ? item.qty : '',
                        unit: (hasAmount(item.price) && !item.hideUnit) ? item.unit : '',
                        days: hasAmount(item.price) ? (item.days || '-') : '',
                        discount: hasAmount(item.price) ? (item.discount || 0) : '',
                        remark: item.remark || '',
                        addr: index === 0 ? (record.clientAddress || '') : '',
                        taxid: index === 0 ? (record.clientTaxId || '') : '',
                        proj: index === 0 ? (record.projectName || '') : '',
                        tax: index === 0 ? (record.taxExcluded ? '未稅' : '') : ''
                    });
                    
                    const histLines = Math.max(estTextLines(item.remark, 36), estTextLines(index === 0 ? record.clientAddress : '', 30), estTextLines(index === 0 ? record.projectName : '', 24));
                    row.height = Math.max(20, histLines * 18 + 4);

                    row.eachCell({ includeEmpty: true }, (cell, colNumber) => {
                        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: recordBgColor } };
                        cell.border = { 
                            top: {style:'thin', color:{argb:'FFD1D1D6'}}, 
                            left: {style:'thin', color:{argb:'FFD1D1D6'}}, 
                            bottom: {style:'thin', color:{argb:'FFD1D1D6'}}, 
                            right: {style:'thin', color:{argb:'FFD1D1D6'}} 
                        };
                        const leftWrapCols = [7, 13, 14, 16];
                        cell.alignment = { vertical: 'middle', horizontal: leftWrapCols.includes(colNumber) ? 'left' : 'center', wrapText: leftWrapCols.includes(colNumber) };
                        
                        if (index === 0) {
                            cell.border.top = { style: 'medium', color: { argb: 'FF0A7AFF' } };
                            if (colNumber <= 5) {
                                cell.font = { bold: true, color: { argb: 'FF1C1C1E' } };
                                if (colNumber === 5) {
                                    cell.font.color = { argb: 'FFFF3B30' }; 
                                    cell.numFmt = '"NT$" #,##0';
                                }
                            }
                        }
                        if (colNumber === 8) cell.numFmt = '#,##0';
                    });
                });
            });
        }
        
        const buf = await workbook.xlsx.writeBuffer();
        const d = new Date();
        const dateStr = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        saveAs(new Blob([buf]), `劉氏工程_歷史報價紀錄_${dateStr}.xlsx`);
    };

    window.addSystemCategory = async function() {
        const input = document.getElementById('new-sys-category');
        const catName = input.value.trim();
        if(!catName) return alert("請輸入分類名稱！");
        if(systemCategories.includes(catName)) return alert("此分類已存在！");

        systemCategories.push(catName);
        categoriesDirty = true;   // 按「儲存變更」後才寫入雲端
        input.value = '';

        updateCategoryUI();
        renderAdminView();
    };

    window.deleteCategory = async function(catName) {
        if (!confirm(`確定要刪除整個【${catName}】類別及其所有項目嗎？\n\n⚠️ 警告：此動作將無法復原！`)) return;
        const r = await safeMutate((state) => {
            state.categories = state.categories.filter(c => c !== catName);
            state.items = state.items.filter(item => item.category !== catName);
            delete state.categorySettings[catName];
        });
        if (!r) return;
        systemCategories = systemCategories.filter(c => c !== catName);
        quoteList = quoteList.filter(q => engineeringDB.some(db => db.id === q.dbId));
        renderAdminView();
        updateCategoryUI();
        renderFrontView();
    };

    window.moveCategory = async function(index, direction) {
        const newIndex = index + direction;
        if (newIndex < 0 || newIndex >= systemCategories.length) return;

        const temp = systemCategories[index];
        systemCategories[index] = systemCategories[newIndex];
        systemCategories[newIndex] = temp;
        categoriesDirty = true;   // 按「儲存變更」後才寫入雲端

        updateCategoryUI();
        renderAdminView();
    };

    window.openCategoryStyleModal = function(catName) {
        document.getElementById('editing-cat-name').value = catName;
        const currentStyle = getCatStyle(catName);
        
        renderIconSelector(currentStyle.icon);
        
        let hexColor = '#000000';
        if (currentStyle.bg.startsWith('#')) {
            hexColor = currentStyle.bg;
        } else {
            const styleTemp = document.createElement('div');
            styleTemp.style.color = currentStyle.bg;
            document.body.appendChild(styleTemp);
            const rgb = window.getComputedStyle(styleTemp).color;
            document.body.removeChild(styleTemp);
            
            const rgbArr = rgb.match(/\d+/g);
            if (rgbArr && rgbArr.length >= 3) {
                hexColor = "#" + ((1 << 24) + (parseInt(rgbArr[0]) << 16) + (parseInt(rgbArr[1]) << 8) + parseInt(rgbArr[2])).toString(16).slice(1);
            }
        }
        document.getElementById('cat-style-color-input').value = hexColor;
        openModal('cat-style-modal');
    };

        const color = document.getElementById('cat-style-color-input').value;

    window.switchView = function(view) {

        document.getElementById('view-front').classList.toggle('hidden', isBack);
        document.getElementById('view-back').classList.toggle('hidden', !isBack);
        
        if (!isBack) {
            document.getElementById('tab-back').classList.remove('active');
            document.getElementById('tab-front').classList.add('active');
            document.getElementById('nav-tabs').style.display = 'none';
            if(quoteList.length > 0) document.getElementById('floating-cart').style.display = 'flex';
            document.getElementById('floating-add').style.display = '';
        } else {
            document.getElementById('tab-front').classList.remove('active');
            document.getElementById('tab-back').classList.add('active');
            document.getElementById('floating-cart').style.display = 'none';
            document.getElementById('floating-add').style.display = 'none';
        }

        if (isBack) renderAdminView(); else { updateCategoryUI(); renderFrontView(); }
    };

            tagsContainer.innerHTML = systemCategories.map((cat, index) => {
                const style = getCatStyle(cat); 
                const upBtn = index > 0 ? `<button class="cat-tag-action-btn" onclick="moveCategory(${index}, -1)" title="上移"><i class="fas fa-arrow-up"></i></button>` : `<div style="width:28px;"></div>`;
                const downBtn = index < systemCategories.length - 1 ? `<button class="cat-tag-action-btn" onclick="moveCategory(${index}, 1)" title="下移"><i class="fas fa-arrow-down"></i></button>` : `<div style="width:28px;"></div>`;
                
                return `
                <div style="display:flex; align-items:center; gap:8px; padding:12px 18px; border-radius:14px; font-weight:900; font-size:1.15rem; background:${style.bg}; color:white; box-shadow:0 6px 16px rgba(0,0,0,0.15);">
                    <div style="display:flex; align-items:center; gap:8px; flex:1;">
                        <i class="fas ${style.icon}"></i>
                        <span>${cat}</span>
                    </div>
                    <div style="display:flex; gap:6px; align-items:center;">
                        ${upBtn}
                        ${downBtn}
                        <div style="width:2px; height:18px; background:rgba(255,255,255,0.3); margin: 0 4px;"></div>
                        <i class="fas fa-times-circle" style="font-size:1.5rem; cursor:pointer; opacity:0.8; transition:opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.8" onclick="deleteCategory('${cat}')" title="刪除此分類"></i>
                    </div>
                </div>
                `;
            }).join('');
        }
    };

    // 快速新增視窗「鎖定」：關閉(預設)＝選好項目自動關閉並回到明細；開啟＝維持在新增畫面可連續加入
    let quickAddLocked = false;
    try { quickAddLocked = localStorage.getItem('quickAddLock') === '1'; } catch (e) {}
    function syncQuickLockUI() {
        const cb = document.getElementById('quick-lock-cb');
        if (cb) cb.checked = quickAddLocked;
        const icon = document.getElementById('quick-lock-icon');
        if (icon) { icon.className = quickAddLocked ? 'fas fa-lock' : 'fas fa-lock-open'; icon.style.color = quickAddLocked ? 'var(--primary)' : ''; }
        const txt = document.getElementById('quick-lock-text');
        if (txt) txt.textContent = quickAddLocked ? '已鎖定' : '鎖定';
        const hint = document.getElementById('quick-add-hint');
        if (hint) hint.textContent = quickAddLocked ? '已鎖定：加入項目後會停留在此畫面，可連續加入。' : '點選工程分類，再選擇項目；選好後會自動關閉並回到明細清單。';
    }
    window.setQuickAddLock = function(on) {
        quickAddLocked = !!on;
        try { localStorage.setItem('quickAddLock', quickAddLocked ? '1' : '0'); } catch (e) {}
        syncQuickLockUI();
    };
    function updateQuickAddCount() {
        const el = document.getElementById('quick-add-count');
        if (el) el.textContent = quoteList.length > 0 ? `已選 ${quoteList.length} 項` : '';
    }
    window.openQuickAddModal = function() {
        const g = document.getElementById('quick-category-grid');
        if (g) g.innerHTML = window.buildCategoryButtonsHtml();   // 開啟時再同步一次，確保與最新分類一致
        updateQuickAddCount();
        syncQuickLockUI();
        openModal('quick-add-modal');
    };
    window.openModal = function(id) { document.getElementById(id).classList.add('active'); };
    window.closeModal = function(id) { document.getElementById(id).classList.remove('active'); };

    window.openModalCategory = function(category) {
        document.getElementById('modal-category-title').innerText = `選擇 ${category} 項目`;
        let filteredDB = engineeringDB.filter(item => item.category === category).sort((a,b) => a.name.localeCompare(b.name));
        const listContainer = document.getElementById('modal-items-list');
        listContainer.innerHTML = filteredDB.length === 0 ? '<div style="text-align:center; padding: 50px; color:#8E8E93; font-size:1.8rem; font-weight:900;">此分類無項目</div>' : '';
        
        let displayIndex = 0;
        filteredDB.forEach(item => {
            const isEven = displayIndex % 2 === 0;
            const div = document.createElement('div');
            div.className = 'selectable-item';
            div.style.background = isEven ? '#FFFFFF' : '#EAEAEA'; 
            
            const hasUnitStr = (item.unit && item.unit.trim() !== '');
            const unitText = hasUnitStr ? `單位: ${item.unit}` : '';
            const daysText = item.hasDays ? '&nbsp; <span style="color:var(--primary);"><i class="fas fa-clock"></i> 天數</span>' : '';
            const subInfoHtml = (unitText || daysText) ? `<div style="font-size:1.3rem; color:#8E8E93; margin-top:10px; font-weight:900;">${unitText} ${daysText}</div>` : '';
            
            div.innerHTML = `
                <div>
                    <div style="font-weight:900; font-size:1.7rem; color: var(--text-main);">${item.name}</div>
                    ${subInfoHtml}
                </div>
                <button class="btn-text" style="background:var(--text-main); color:white; font-size:1.4rem; padding: 16px 30px; border-radius:14px;"><i class="fas fa-plus"></i> 加入</button>
            `;
            div.onclick = () => { addItemToQuote(item.id); closeModal('item-modal'); if (!quickAddLocked) closeModal('quick-add-modal'); };
            listContainer.appendChild(div);
            displayIndex++;
        });
        openModal('item-modal');
    };

    window.openCartModal = function() {
        const listContainer = document.getElementById('cart-items-list');
        if (quoteList.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; padding: 50px; color:#8E8E93; font-size:1.5rem; font-weight:900;"><i class="fas fa-box-open" style="font-size:4rem; margin-bottom:20px; opacity:0.3; display:block;"></i>目前清單內尚無項目</div>';
        } else {
            listContainer.innerHTML = quoteList.map(q => {
                const dbItem = engineeringDB.find(db => db.id === q.dbId);
                if(!dbItem) return '';
                let subtotal = calcSubtotal(q, dbItem);
                const cu = getItemUnit(q, dbItem);
                return `
                <div style="padding: 20px; border: 1px solid rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; background: white; margin-bottom: 12px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                    <div style="flex:1; padding-right:14px;">
                        <div style="font-weight: 900; font-size: 1.4rem; color: var(--text-main); line-height:1.4;">${dbItem.name}</div>
                        <div style="font-size: 1.15rem; color: var(--primary); font-weight:800; margin-top: 8px;">單價: $${q.price.toLocaleString()} &nbsp;|&nbsp; 數量: ${q.qty}${(!q.hideUnit && cu) ? ' ' + esc(cu) : ''}</div>
                        ${q.remark ? `<div style="font-size:1.05rem; color:#6B6B70; margin-top:6px; white-space:pre-wrap;">備註：${esc(q.remark)}</div>` : ''}
                    </div>
                    <div style="text-align: right;">
                        <div style="font-weight: 900; font-size: 1.6rem; color: var(--danger);">$${subtotal.toLocaleString()}</div>
                        <button onclick="removeQuoteItem('${q.id}'); openCartModal();" style="margin-top: 12px; background: rgba(255,59,48,0.1); border-radius: 10px; border: none; color: var(--danger); font-size: 1.15rem; padding: 10px 16px; cursor: pointer; font-weight:bold; transition:all 0.2s;"><i class="fas fa-trash"></i> 移除</button>
                    </div>
                </div>`;
            }).join('');
        }
        openModal('cart-modal');
    };

    window.addItemToQuote = function(dbId) {
        if (!systemSettings.allowDuplicateItems && quoteList.some(q => q.dbId === dbId)) return alert('已經添加請勿重複添加！');
        const dbItem = engineeringDB.find(db => db.id === dbId);
        const defaultHide = dbItem ? (dbItem.defaultHideUnit || false) : false;
        
        const newId = 'q_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);   // 允許重複項目時避免 id 撞號
        quoteList.push({ id: newId, dbId: dbId, price: 0, qty: 1, days: 1, discount: 0, hideUnit: defaultHide, unit: dbItem ? dbItem.unit : '', unitBase: dbItem ? dbItem.unit : '', remark: '' });
        renderFrontView();
        
        setTimeout(() => { 
            const newRowEl = document.getElementById(`quote-row-${newId}`);
            if (newRowEl) {
                newRowEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                newRowEl.classList.add('row-new'); setTimeout(() => newRowEl.classList.remove('row-new'), 1400);
                const originalBg = newRowEl.style.backgroundColor;
                newRowEl.style.transition = 'background-color 0.5s ease';
                newRowEl.style.backgroundColor = 'rgba(10, 122, 255, 0.1)';
                setTimeout(() => { newRowEl.style.backgroundColor = originalBg; }, 800);
            } else {
                document.getElementById('main-scroll-container').scrollTo({ top: document.getElementById('main-scroll-container').scrollHeight, behavior: 'smooth' }); 
            }
        }, 150);
    };

    window.toggleUnit = function(qId) {
        const target = quoteList.find(q => q.id === qId);
        if (target) {
            const dbItem = engineeringDB.find(db => db.id === target.dbId);
            const curUnit = getItemUnit(target, dbItem);
            const hasUnit = curUnit && curUnit.trim() !== '';
            if (!hasUnit) return; 
            
            target.hideUnit = !target.hideUnit;
            const unitSpan = document.getElementById(`unit-display-${qId}`);
            const eyeIcon = document.getElementById(`unit-toggle-icon-${qId}`);
            if (unitSpan && eyeIcon) {
                unitSpan.style.display = target.hideUnit ? 'none' : 'inline-flex';
                eyeIcon.className = `fas ${target.hideUnit ? 'fa-eye-slash' : 'fa-eye'}`;
                eyeIcon.style.color = target.hideUnit ? '#C7C7CC' : 'var(--primary)';
            }
        }
    };

    /* 單位一鍵換算：數量依比例換算，單價反向換算，確保 數量×單價 不變（小計金額不變） */
    window.convertItemUnit = function(qId, targetUnit) {
        const target = quoteList.find(q => q.id === qId);
        if (!target) return;
        const dbItem = engineeringDB.find(db => db.id === target.dbId);
        if (!dbItem) return;
        const currentUnit = getItemUnit(target, dbItem);
        if (currentUnit === targetUnit) return;
        const ratio = getConversionRatio(currentUnit, targetUnit);
        if (ratio === null || !(ratio > 0)) { renderFrontView(); return; }
        const product = (target.price || 0) * (target.qty || 0);
        const newQty = roundSmart((target.qty || 0) * ratio);
        target.qty = newQty;
        target.price = newQty > 0 ? roundSmart(product / newQty) : target.price;
        target.unit = targetUnit;
        target.unitBase = dbItem.unit;
        renderFrontView();
    };

    window.autoGrowRemark = function(el) {
        if (!el) return;
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight + 2, 320) + 'px';
    };
    window.handleRemark = function(qId, value) {
        const target = quoteList.find(q => q.id === qId);
        if (target) target.remark = String(value || '');
    };

    window.handleInput = function(qId, field, value) {
        let val = Number(value) || 0;
        const target = quoteList.find(q => q.id === qId);
        if (target) { target[field] = val; updateSubtotalAndTotal(qId); }
    };

    window.changeQuoteQty = function(qId, field, delta) {
        const target = quoteList.find(q => q.id === qId);
        if (target) {
            let newVal = roundSmart((Number(target[field]) || 0) + delta);
            if(field === 'qty' || field === 'days') newVal = Math.max(1, newVal);
            else newVal = Math.max(0, newVal);
            target[field] = newVal;
            const inputEl = document.getElementById(`input-${field}-${qId}`);
            if(inputEl) inputEl.value = newVal;
            updateSubtotalAndTotal(qId);
        }
    };

    function updateSubtotalAndTotal(qId) {
        const target = quoteList.find(q => q.id === qId);
        if(!target) return;
        const dbItem = engineeringDB.find(db => db.id === target.dbId);
        if(!dbItem) return;
        let subtotal = calcSubtotal(target, dbItem);
        const subtotalEl = document.getElementById(`subtotal-${qId}`);
        if(subtotalEl) subtotalEl.innerText = subtotal.toLocaleString();
        calculateTotal();
    }

    window.removeQuoteItem = function(qId) { 
        quoteList = quoteList.filter(q => q.id !== qId); 
        renderFrontView(); 
    };

    window.clearAllQuotes = function() {
        if(quoteList.length === 0) return;
        if(confirm('確定要清空下方添加的明細清單內容？')) { quoteList = []; renderFrontView(); }
    };

    function calculateTotal() {
        let newTotal = 0;
        quoteList.forEach(qItem => {
            const dbItem = engineeringDB.find(db => db.id === qItem.dbId);
            if (dbItem) newTotal += calcSubtotal(qItem, dbItem);
        });
        if (newTotal !== currentGrandTotal) {
            currentGrandTotal = newTotal;
            document.getElementById('grand-total-display').innerText = currentGrandTotal.toLocaleString();
            const box = document.getElementById('animated-total-box');
            box.classList.remove('updated');
            void box.offsetWidth; 
            box.classList.add('updated');
        }
        
        const cartBadge = document.getElementById('cart-badge');
        const cartIcon = document.getElementById('floating-cart');
        if (cartBadge && cartIcon) {
            cartBadge.innerText = quoteList.length;
            updateQuickAddCount();
            if (quoteList.length > 0 && !document.getElementById('view-front').classList.contains('hidden')) {
                cartIcon.style.display = 'flex';
            } else {
                cartIcon.style.display = 'none';
            }
        }
    }

    window.renderFrontView = function() {
        const container = document.getElementById('quote-items-container');
        const emptyMsg = document.getElementById('empty-quote-msg');
        const globalHeader = document.getElementById('global-header');
        container.innerHTML = '';
        
        if (quoteList.length === 0) {
            emptyMsg.style.display = 'block'; globalHeader.style.display = 'none'; calculateTotal(); return;
        }
        
        emptyMsg.style.display = 'none'; globalHeader.style.display = 'grid';

        const groupedList = {};
        quoteList.forEach(q => {
            const db = engineeringDB.find(d => d.id === q.dbId);
            if (db) { const cat = db.category || '未分類'; if(!groupedList[cat]) groupedList[cat] = []; groupedList[cat].push({ q, db }); }
        });

        // 不在分類清單內的項目（分類被刪除/改名）也要顯示，否則會「計入總額卻看不到」
        const catOrderFront = [...systemCategories, ...Object.keys(groupedList).filter(c => !systemCategories.includes(c))];
        catOrderFront.forEach((cat) => {
            if(!groupedList[cat]) return;
            const style = getCatStyle(cat);
            
            const headerDiv = document.createElement('div');
            headerDiv.className = 'category-header';
            headerDiv.style.background = style.bg;
            headerDiv.innerHTML = `<i class="fas ${style.icon}"></i> ${cat}`;
            container.appendChild(headerDiv);
            
            let isEven = true;
            groupedList[cat].forEach(data => {
                const { q, db } = data;
                let subtotal = calcSubtotal(q, db);
                
                const row = document.createElement('div');
                row.className = 'quote-item-row';
                row.id = `quote-row-${q.id}`; 
                
                row.style.background = isEven ? style.rowEven : style.rowOdd;
                row.style.borderLeft = `8px solid ${style.border}`; 
                isEven = !isEven;
                
                let daysHtml = db.hasDays ? `
                    <div class="qty-control-group w-full">
                        <button class="qty-btn" onclick="changeQuoteQty('${q.id}', 'days', -1)"><i class="fas fa-minus"></i></button>
                        <input type="number" id="input-days-${q.id}" value="${q.days}" min="1" onfocus="if(this.value==='0') this.value='';" onblur="if(this.value==='') { this.value='1'; handleInput('${q.id}', 'days', 1); }" oninput="handleInput('${q.id}', 'days', this.value)">
                        <button class="qty-btn" onclick="changeQuoteQty('${q.id}', 'days', 1)"><i class="fas fa-plus"></i></button>
                        <div class="unit-box">
                            <span style="font-weight:900; color:#8E8E93; font-size:1.3rem;">天</span>
                        </div>
                    </div>` : `<div style="text-align:center; font-size:2.4rem; color:#D1D1D6; font-weight:900; width: 100%;"> - </div>`;

                const displayUnit = getItemUnit(q, db);
                const hasUnit = displayUnit && displayUnit.trim() !== '';
                const hideUnitDisplay = q.hideUnit || !hasUnit;
                const eyeColor = q.hideUnit ? '#C7C7CC' : 'var(--primary)';
                const eyeClass = q.hideUnit ? 'fa-eye-slash' : 'fa-eye';
                const convertOpts = hasUnit ? getUnitConvertOptions(displayUnit) : null;
                const unitValueHtml = convertOpts
                    ? `<select onchange="convertItemUnit('${q.id}', this.value)" title="一鍵換算單位" style="border:none; background:transparent; box-shadow:none; padding:0; width:auto; font-weight:900; color:#8E8E93; font-size:1.2rem; max-width:112px; min-width:32px; cursor:pointer; -webkit-appearance:none; appearance:none; text-align-last:right; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">
                        ${convertOpts.map(u => `<option value="${u}" ${u === displayUnit ? 'selected' : ''}>${u}</option>`).join('')}
                       </select>`
                    : (hasUnit ? esc(displayUnit) : '');
                
                const toggleBtnHtml = hasUnit ? `
                    <button onclick="toggleUnit('${q.id}')">
                        <i id="unit-toggle-icon-${q.id}" class="fas ${eyeClass}" style="color:${eyeColor}; font-size:1.2rem;"></i>
                    </button>
                ` : '';

                const discountVal = q.discount > 0 ? q.discount : 0;

                row.innerHTML = `
                    <div class="item-name">${db.name}</div>
                    
                    <div class="mobile-field" data-label="單價">
                        <div class="input-wrapper w-full">
                            <input type="number" id="input-price-${q.id}" value="${q.price}" min="0" onfocus="if(this.value==='0') this.value='';" onblur="if(this.value==='') { this.value='0'; handleInput('${q.id}', 'price', 0); }" oninput="handleInput('${q.id}', 'price', this.value)">
                            <div class="unit-box">
                                <span>元</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mobile-field" data-label="數量">
                        <div class="qty-control-group w-full">
                            <button class="qty-btn" onclick="changeQuoteQty('${q.id}', 'qty', -1)"><i class="fas fa-minus"></i></button>
                            <input type="number" id="input-qty-${q.id}" value="${q.qty}" min="1" step="any" onfocus="if(this.value==='0') this.value='';" onblur="if(this.value==='') { this.value='1'; handleInput('${q.id}', 'qty', 1); }" oninput="handleInput('${q.id}', 'qty', this.value)">
                            <button class="qty-btn" onclick="changeQuoteQty('${q.id}', 'qty', 1)"><i class="fas fa-plus"></i></button>
                            <div class="unit-box">
                                <span id="unit-display-${q.id}" style="display:${hideUnitDisplay ? 'none' : 'inline-flex'}; align-items:center;">${unitValueHtml}</span>
                                ${toggleBtnHtml}
                            </div>
                        </div>
                    </div>
                    
                    <div class="mobile-field" data-label="天數">${daysHtml}</div>
                    
                    <div class="mobile-field" data-label="優惠折抵">
                        <div class="input-wrapper discount-box w-full">
                            <input type="number" id="input-discount-${q.id}" value="${discountVal}" min="0" onfocus="if(this.value==='0') this.value='';" onblur="if(this.value==='') { this.value='0'; handleInput('${q.id}', 'discount', 0); }" oninput="handleInput('${q.id}', 'discount', this.value)">
                            <div class="unit-box">
                                <span style="color:var(--danger) !important;">元</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="item-remark">
                        <span class="item-remark-label">備註</span>
                        <textarea id="input-remark-${q.id}" rows="1" placeholder="備註（選填，可按 Enter 換行；有填才會顯示在報價單項目下方）" oninput="handleRemark('${q.id}', this.value); autoGrowRemark(this)">
${esc(q.remark || '')}</textarea>
                    </div>
                    <div class="subtotal-display">$ <span id="subtotal-${q.id}">${subtotal.toLocaleString()}</span></div>
                    
                    <button class="delete-btn" onclick="removeQuoteItem('${q.id}')"><i class="fas fa-trash"></i></button>
                `;
                container.appendChild(row);
            });
        });
        calculateTotal();
        // 備註框依內容自動長高（含已有多行備註的項目）
        requestAnimationFrame(() => document.querySelectorAll('.item-remark textarea').forEach(window.autoGrowRemark));
    };

    window.toggleCategory = function(index) {
        const body = document.getElementById(`cat-body-${index}`);
        const icon = document.getElementById(`cat-icon-${index}`);
        if(body.classList.contains('collapsed-body')) {
            body.classList.remove('collapsed-body');
            icon.style.transform = 'rotate(180deg)';
        } else {
            body.classList.add('collapsed-body');
            icon.style.transform = 'rotate(0deg)';
        }
    };

            const itemsInCat = engineeringDB.filter(item => item.category === cat);

                    </button>
                    <button class="btn-text" style="background:rgba(255,59,48,0.9); color:white; padding:10px 16px; font-size:1.15rem; border-radius:12px; box-shadow:none; border:1px solid rgba(255,255,255,0.2);" onclick="deleteCategory('${cat}'); event.stopPropagation();">

                 catBody.innerHTML = `<div style="text-align:center; padding:40px; color:#8E8E93; font-size:1.3rem; font-weight:900;">此分類目前無項目</div>`;
            } else {

                    const isEven = idx % 2 === 0;
