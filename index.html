            <div id="action-center">
                <button class="btn" id="btn-capture" style="background:#0A7AFF; color:white;"><i class="fa-solid fa-image"></i> 產出並儲存圖片</button>
                <button class="btn" onclick="window.close()" style="background:white; color:#1A1A2E;"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div id="loading"><div class="spinner"></div><div>正在產生高清晰圖片...</div></div>
            <div id="result-area">
                <div class="hint">${isIOS ? '📲 圖片已產生！請<strong>長按下方圖片</strong>並選擇「加入照片」儲存' : '💾 圖片已產生！請點擊下載按鈕或長按圖片儲存'}</div>
                <img id="result-img" />
                ${!isIOS ? '<button class="btn" id="btn-download" style="background:#0A7AFF; color:white; margin-top:8px;"><i class="fa-solid fa-download"></i> 下載圖片</button>' : ''}
                <button class="btn" onclick="window.close()" style="background:white; color:#1A1A2E;"><i class="fa-solid fa-arrow-left"></i> 返回</button>
            </div>
            <div id="receipt-wrap">
                ${headerHtml}
                <div class="r-info">
                    <div class="r-info-col">${leftInfoHtml}</div>
                    <div class="r-info-col">
                        <div>報價單號：${currentQuoteNo}</div>
                        <div>報價日期：${dateStr}</div>
                    </div>
                </div>
                ${projectHtml}
                <table>
                    <thead><tr><th>類別</th><th style="text-align:left;">項目明細</th><th>單價</th><th>數量</th><th>天數</th><th>項目小計</th></tr></thead>
                    <tbody>${tbody}</tbody>
                </table>
                ${totalsHtml}
            </div>
            <script>
                document.getElementById('btn-capture').addEventListener('click', function() {
                    const target = document.getElementById('receipt-wrap');
                    document.getElementById('loading').style.display = 'flex';
                    setTimeout(() => {
                        html2canvas(target, { scale: 2.5, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                            const imgData = canvas.toDataURL('image/png');
                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('action-center').style.display = 'none';
                            document.getElementById('result-area').style.display = 'flex';
                            document.getElementById('result-img').src = imgData;
                            const dlBtn = document.getElementById('btn-download');
                            if (dlBtn) {
                                dlBtn.onclick = () => {
                                    const a = document.createElement('a');
                                    a.href = imgData;
                                    a.download = '${currentQuoteNo}_${clientName}.png';
                                    a.click();
                                };
                            }
                        });
                    }, 600);
                });
            <\/script>
        </body></html>`);
        newWin.document.close();
    };

    window.exportToExcelFormatted = async function() {
        const clientName = document.getElementById('client-name-input').value.trim();
        if (!clientName) { alert('請輸入「客戶名稱」！'); document.getElementById('client-name-input').focus(); return; }
        if (quoteList.length === 0) return alert('請加入工程項目！');
        if (!confirm('確認要送出該完工報價單並產出 Excel 嗎？')) return;

        const showTitle = document.getElementById('show-title-cb').checked;
        const customTitleInput = document.getElementById('quote-title-input').value.trim();
        const displayTitle = customTitleInput !== '' ? customTitleInput : '劉氏工程 — 完工報價單';
        const clientAddress = document.getElementById('client-address-input').value.trim();
        const clientTaxId = document.getElementById('client-taxid-input').value.trim();
        const projectName = document.getElementById('project-name-input').value.trim();
        const taxExcluded = document.getElementById('tax-excluded-cb').checked;

        const saveResult = await window.recordQuoteHistory();
        if (saveResult.status === 'error') return;
        if (saveResult.status === 'duplicate') {
            alert('系統提示：此筆報價明細已成功儲存過，將直接為您匯出檔案！\n(單號：' + saveResult.quoteNo + ')');
        } else {
            alert('報價紀錄已成功產生單號並同步儲存至雲端資料庫！');
        }

        const currentQuoteNo = saveResult.quoteNo;
        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('報價單', {
            pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.25, right: 0.25, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } }
        });
        ws.columns = [{ width: 25 }, { width: 70 }, { width: 20 }, { width: 20 }, { width: 15 }, { width: 30 }];

        if (showTitle) {
            ws.mergeCells('A1:F2');
            const titleCell = ws.getCell('A1');
            titleCell.value = displayTitle;
            titleCell.font = { name: '微軟正黑體', size: 26, bold: true, color: { argb: 'FF1A1A2E' } };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
        } else {
            ws.addRow([]);
        }
        ws.addRow([]);

        const d = new Date();
        const leftInfoLines = [`客戶名稱：${clientName}`];
        if (clientAddress) leftInfoLines.push(`客戶地址：${clientAddress}`);
        if (clientTaxId) leftInfoLines.push(`統一編號：${clientTaxId}`);
        const rightInfoLines = [`報價單號：${currentQuoteNo}`, `報價日期：${d.toLocaleDateString('zh-TW')}`];
        const infoRowCount = Math.max(leftInfoLines.length, rightInfoLines.length);
        const infoRows = [];
        for (let i = 0; i < infoRowCount; i++) infoRows.push(ws.addRow([]));
        ws.mergeCells(`A${infoRows[0].number}:D${infoRows[infoRowCount - 1].number}`);
        ws.getCell(`A${infoRows[0].number}`).alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
        ws.getCell(`A${infoRows[0].number}`).value = leftInfoLines.join('\n');
        ws.getCell(`A${infoRows[0].number}`).font = { name: '微軟正黑體', size: 15, bold: true };
        infoRows.forEach((row, i) => {
            if (rightInfoLines[i]) {
                ws.mergeCells(`E${row.number}:F${row.number}`);
                ws.getCell(`E${row.number}`).value = rightInfoLines[i];
                ws.getCell(`E${row.number}`).font = { name: '微軟正黑體', size: 15, bold: true };
                ws.getCell(`E${row.number}`).alignment = { vertical: 'middle', horizontal: 'left' };
            }
        });
        if (infoRowCount > 1) infoRows[0].height = 22 * leftInfoLines.length;

        if (projectName) {
            const projRow = ws.addRow([]);
            ws.mergeCells(`A${projRow.number}:F${projRow.number}`);
            ws.getCell(`A${projRow.number}`).value = `工程名稱：${projectName}`;
            ws.getCell(`A${projRow.number}`).font = { name: '微軟正黑體', size: 15, bold: true, color: { argb: 'FF1A1A2E' } };
            ws.getCell(`A${projRow.number}`).alignment = { vertical: 'middle', horizontal: 'left' };
            ws.getCell(`A${projRow.number}`).border = { top: { style: 'thin', color: { argb: 'FFC7C7CC' } } };
            projRow.height = 24;
        }
        ws.addRow([]);

        const headerRow = ws.addRow(['類別', '項目明細', '單價', '數量', '天數', '項目小計']);
        headerRow.height = 42;
        headerRow.eachCell((cell) => {
            cell.font = { name: '微軟正黑體', bold: true, size: 15, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1A1A2E' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' };
            cell.border = { top: {style:'medium'}, left: {style:'medium'}, bottom: {style:'medium'}, right: {style:'medium'} };
        });

        const sortedQuoteList = [...quoteList].sort((a, b) => {
            const dbA = engineeringDB.find(db => db.id === a.dbId), dbB = engineeringDB.find(db => db.id === b.dbId);
            if (!dbA || !dbB) return 0;
            const indexA = systemCategories.indexOf(dbA.category);
            const indexB = systemCategories.indexOf(dbB.category);
            if (indexA !== indexB) return indexA - indexB;
            return dbA.name.localeCompare(dbB.name);
        });

        let isEvenRow = true;
        sortedQuoteList.forEach(qItem => {
            const dbItem = engineeringDB.find(db => db.id === qItem.dbId); if (!dbItem) return;
            let subtotal = Math.max(0, Math.round(qItem.price * qItem.qty * (dbItem.hasDays ? qItem.days : 1)) - (qItem.discount || 0));
            const itemUnit = qItem.unit || dbItem.unit;
            const hasUnit = itemUnit && itemUnit.trim() !== '';
            const hideUnitDisplay = qItem.hideUnit || !hasUnit;
            const unitStr = hideUnitDisplay ? `${qItem.qty}` : `${qItem.qty} ${itemUnit}`;
            let itemNameText = dbItem.name;
            if (qItem.discount && qItem.discount > 0) itemNameText += `\n(優惠折抵: -$${qItem.discount.toLocaleString()})`;
            const row = ws.addRow([dbItem.category, itemNameText, qItem.price, unitStr, dbItem.hasDays ? `${qItem.days} 天` : '-', subtotal]);
            row.height = (qItem.discount && qItem.discount > 0) ? 48 : 36;
            const bg = isEvenRow ? 'FFFFFFFF' : 'FFF0F2F8'; isEvenRow = !isEvenRow;
            row.eachCell({ includeEmpty: true }, (cell, colIdx) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } };
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                cell.font = { name: '微軟正黑體', size: 14, bold: true, color: { argb: 'FF1A1A2E' } };
                if (colIdx===1) { cell.alignment={horizontal:'center', vertical:'middle'}; cell.font={name:'微軟正黑體', bold:true, color:{argb:'FF0A7AFF'}}; }
                else if (colIdx===2) { cell.alignment={horizontal:'left', vertical:'middle', indent:1, wrapText:true}; }
                else { cell.alignment={horizontal:'center', vertical:'middle'}; if (colIdx===3||colIdx===6) cell.numFmt='#,##0'; }
            });
        });

        ws.addRow([]);
        let finalGrandTotal = currentGrandTotal;

        if (taxExcluded) {
            const taxAmount = Math.round(currentGrandTotal * 0.05);
            finalGrandTotal = currentGrandTotal + taxAmount;

            const noteRow = ws.addRow(['以上金額皆為未稅']);
            ws.mergeCells(`A${noteRow.number}:F${noteRow.number}`);
            noteRow.getCell(1).font = { name: '微軟正黑體', size: 13, bold: true, color: { argb: 'FF8E8E9E' } };
            noteRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };

            const subRow = ws.addRow(['總計：', '', '', '', '', currentGrandTotal]);
            const taxRow = ws.addRow(['稅額：', '', '', '', '', taxAmount]);
            const finalRow = ws.addRow(['總計金額：', '', '', '', '', finalGrandTotal]);
            [subRow, taxRow].forEach(r => {
                r.height = 32;
                ws.mergeCells(`A${r.number}:E${r.number}`);
                r.getCell(1).font = { name: '微軟正黑體', size: 15, bold: true };
                r.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
                r.getCell(6).font = { name: 'Arial', size: 16, bold: true, color: { argb: 'FFFF3B30' } };
                r.getCell(6).alignment = { horizontal: 'right', vertical: 'middle' };
                r.getCell(6).numFmt = '"NT$" #,##0';
                const bs = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                r.getCell(1).border = bs; r.getCell(6).border = bs;
            });
            finalRow.height = 50;
            ws.mergeCells(`A${finalRow.number}:E${finalRow.number}`);
            finalRow.getCell(1).font = { name: '微軟正黑體', size: 20, bold: true };
            finalRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
            finalRow.getCell(6).font = { name: 'Arial', size: 24, bold: true, color: { argb: 'FFFF3B30' } };
            finalRow.getCell(6).alignment = { horizontal: 'right', vertical: 'middle' };
            finalRow.getCell(6).numFmt = '"NT$" #,##0';
            const borderStyleFinal = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'double', color:{argb:'FFFF3B30'}}, right: {style:'thin'} };
            finalRow.getCell(1).border = borderStyleFinal;
            finalRow.getCell(6).border = borderStyleFinal;
        } else {
            const tRow = ws.addRow(['總計金額：', '', '', '', '', currentGrandTotal]);
            tRow.height = 50;
            ws.mergeCells(`A${tRow.number}:E${tRow.number}`);
            tRow.getCell(1).font = { name: '微軟正黑體', size: 20, bold: true };
            tRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
            tRow.getCell(6).font = { name: 'Arial', size: 24, bold: true, color: { argb: 'FFFF3B30' } };
            tRow.getCell(6).alignment = { horizontal: 'right', vertical: 'middle' };
            tRow.getCell(6).numFmt = '"NT$" #,##0';
            const borderStyle = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'double', color:{argb:'FFFF3B30'}}, right: {style:'thin'} };
            tRow.getCell(1).border = borderStyle;
            tRow.getCell(6).border = borderStyle;
        }

        const chineseRow = ws.addRow([`總計新台幣${numberToChineseUpper(finalGrandTotal)}元整`]);
        ws.mergeCells(`A${chineseRow.number}:F${chineseRow.number}`);
        chineseRow.getCell(1).font = { name: '微軟正黑體', size: 15, bold: true, color: { argb: 'FF1A1A2E' } };
        chineseRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
        chineseRow.height = 30;

        const buf = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `${currentQuoteNo}_${clientName}.xlsx`);
    };

    let secretClickCount = 0; let secretTimer;
    document.getElementById('secret-trigger').addEventListener('click', () => {
        secretClickCount++; clearTimeout(secretTimer);
        if (secretClickCount >= 3) {
            document.getElementById('nav-tabs').style.display = 'flex';
            switchView('back');
            secretClickCount = 0;
        }
        secretTimer = setTimeout(() => { secretClickCount = 0; }, 1000);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => { console.log('SW 未就緒。'); });
        });
    }
</script>
</body>
</html>
