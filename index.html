        const sortedQuoteList = [...quoteList].sort((a, b) => {
            const dbA = engineeringDB.find(db => db.id === a.dbId), dbB = engineeringDB.find(db => db.id === b.dbId);
            if(!dbA || !dbB) return 0;
            const indexA = systemCategories.indexOf(dbA.category);
            const indexB = systemCategories.indexOf(dbB.category);
            if (indexA !== indexB) return indexA - indexB;
            return dbA.name.localeCompare(dbB.name);
        });

        sortedQuoteList.forEach(qItem => {
            const dbItem = engineeringDB.find(db => db.id === qItem.dbId); if (!dbItem) return;
            let subtotal = Math.max(0, (qItem.price * qItem.qty * (dbItem.hasDays ? qItem.days : 1)) - (qItem.discount || 0));
            
            const displayCat = dbItem.category; 
            const bg = isEvenRow ? '#FFFFFF' : '#F2F2F7'; isEvenRow = !isEvenRow;
            
            const hasUnit = dbItem.unit && dbItem.unit.trim() !== '';
            const hideUnitDisplay = qItem.hideUnit || !hasUnit;
            const unitDisplay = hideUnitDisplay ? '' : ` ${dbItem.unit}`;
            
            const discountBadge = (qItem.discount && qItem.discount > 0) ? `<br><span style="display:inline-block; margin-top:6px; background:#FFF0F0; color:#FF3B30; padding:4px 8px; border-radius:6px; font-size:14px; font-weight:900; border:1px solid rgba(255,59,48,0.2);">✨ 優惠折抵: -$${qItem.discount.toLocaleString()}</span>` : '';

            tbody += `<tr style="background-color: ${bg}; border-bottom: 2px solid #E5E5EA;">
                <td style="padding:18px; font-weight:900; color:#0A7AFF; font-size:18px;">${displayCat}</td>
                <td style="padding:18px; text-align:left; font-weight:900; font-size:18px;">${dbItem.name}${discountBadge}</td>
                <td style="padding:18px; font-weight:800; font-size:18px;">${qItem.price.toLocaleString()}</td>
                <td style="padding:18px; font-weight:800; font-size:18px;">${qItem.qty}${unitDisplay}</td>
                <td style="padding:18px; font-weight:800; font-size:18px;">${dbItem.hasDays ? qItem.days + ' 天' : '-'}</td>
                <td style="padding:18px; font-weight:900; font-size:20px;">${subtotal.toLocaleString()}</td>
            </tr>`;
        });

        const headerHtml = showTitle ? `<div class="r-header"><h1>${displayTitle}</h1></div>` : '';

        newWin.document.write(`<!DOCTYPE html>
        <html lang="zh-TW">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>產出完工報價單</title>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>
            <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
            <style>
                * { box-sizing: border-box; font-family: -apple-system, "微軟正黑體", sans-serif; font-weight: 800; }
                body { background: #F2F2F7; margin: 0; padding: 0; }
                #action-center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; padding: 20px; }
                .btn { width: 100%; max-width: 380px; padding: 22px; border-radius: 20px; font-weight: 900; font-size: 1.35rem; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
                #loading { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); color: white; flex-direction: column; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; z-index: 50; }
                .spinner { border: 6px solid rgba(255,255,255,0.2); border-top: 6px solid #0A7AFF; border-radius: 50%; width: 70px; height: 70px; animation: spin 1s linear infinite; margin-bottom: 24px; }
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                
                #result-area { display: none; padding: 20px; text-align: center; flex-direction: column; align-items: center; gap: 24px; }
                #result-img { max-width: 100%; border-radius: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.2); }
                .hint { background: rgba(10, 122, 255, 0.1); border: 2.5px solid rgba(10, 122, 255, 0.3); color: #0A7AFF; padding: 18px 28px; border-radius: 18px; font-weight: 900; font-size: 1.35rem; margin-bottom: 10px; }
                
                /* 防止行動裝置截圖時版面被撐破，改用絕對負空間與 z-index 防護 */
                #receipt-wrap { position: absolute; left: -9999px; top: -9999px; width: 950px; background: white; padding: 60px; z-index: -9999; }
                .r-header { text-align: center; margin-bottom: 40px; border-bottom: 6px solid #1C1C1E; padding-bottom: 25px; }
                .r-header h1 { font-size: 46px; margin: 0 0 14px 0; color: #1C1C1E; font-weight: 900; letter-spacing: 4px; }
                .r-info { display: flex; justify-content: space-between; font-size: 20px; font-weight: 900; color: #333; margin-bottom: 35px; }
                table { width: 100%; border-collapse: collapse; text-align: center; font-size: 18px; border: 4px solid #1C1C1E; table-layout: auto; }
                th { background: #1C1C1E; color: white; padding: 20px; border: 4px solid #1C1C1E; font-size: 22px; font-weight: 900; white-space: nowrap; }
                td { border: 2.5px solid #C7C7CC; }
                td:nth-child(1), td:nth-child(3), td:nth-child(4), td:nth-child(5), td:nth-child(6) { white-space: nowrap; }
                .r-total { text-align: right; font-size: 42px; font-weight: 900; color: #FF3B30; margin-top: 45px; letter-spacing: -1px; font-family: Arial, sans-serif; }
            </style>
        </head>
        <body>
            <div id="action-center">
                <button class="btn" id="btn-capture" style="background:#0A7AFF; color:white;"><i class="fa-solid fa-image"></i> 產出並儲存圖片</button>
                <button class="btn" onclick="window.close()" style="background:white; color:#1C1C1E;"><i class="fa-solid fa-xmark"></i> 關閉</button>
            </div>
            <div id="loading"><div class="spinner"></div><div>正在產生高清晰圖片...</div></div>
            <div id="result-area">
                <div class="hint">${isIOS ? '📲 圖片已產生！請<strong>長按下方圖片</strong>並選擇「加入照片」儲存' : '💾 圖片已產生！請點擊下載按鈕或長按圖片儲存'}</div>
                <img id="result-img" />
                ${!isIOS ? '<button class="btn" id="btn-download" style="background:#0A7AFF; color:white; margin-top:10px;"><i class="fa-solid fa-download"></i> 下載圖片</button>' : ''}
                <button class="btn" onclick="window.close()" style="background:white; color:#1C1C1E;"><i class="fa-solid fa-arrow-left"></i> 返回</button>
            </div>
            
            <div id="receipt-wrap">
                ${headerHtml}
                <div class="r-info">
                    <div>客戶名稱：${clientName}</div>
                    <div style="display:flex; flex-direction:column; gap:6px; text-align:left;">
                        <div>報價單號：${currentQuoteNo}</div>
                        <div>報價日期：${dateStr}</div>
                    </div>
                </div>
                <table>
                    <thead><tr><th>類別</th><th style="text-align:left;">項目明細</th><th>單價</th><th>數量</th><th>天數</th><th>項目小計</th></tr></thead>
                    <tbody>${tbody}</tbody>
                </table>
                <div class="r-total">總計金額：NT$ ${currentGrandTotal.toLocaleString()}</div>
            </div>
            
            <script>
                document.getElementById('btn-capture').addEventListener('click', function() {
                    const target = document.getElementById('receipt-wrap');
                    document.getElementById('loading').style.display = 'flex';
                    setTimeout(() => {
                        html2canvas(target, { scale: 2.5, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                            const imgData = canvas.toDataURL('image/png');
                            document.getElementById('loading').style.display = 'none';
                            document.getElementById('action-center').style.display = 'none';
                            document.getElementById('result-area').style.display = 'flex';
                            document.getElementById('result-img').src = imgData;

    };

    window.exportToExcelFormatted = async function() {
        const clientName = document.getElementById('client-name-input').value.trim();
        if (!clientName) { alert('請輸入「客戶名稱」！'); document.getElementById('client-name-input').focus(); return; }
        if (quoteList.length === 0) return alert('請加入工程項目！');
        if (!confirm('確認要送出該完工報價單並產出 Excel 嗎？')) return;

        const showTitle = document.getElementById('show-title-cb').checked;
        const customTitleInput = document.getElementById('quote-title-input').value.trim();
        const displayTitle = customTitleInput !== '' ? customTitleInput : '劉氏工程 — 完工報價單';

        const saveResult = await window.recordQuoteHistory();
        if (saveResult.status === 'error') return;
        
        if (saveResult.status === 'duplicate') {
            alert('系統提示：此筆報價明細已成功儲存過，將直接為您匯出檔案！\n(單號：' + saveResult.quoteNo + ')');
        } else {
            alert('報價紀錄已成功產生單號並同步儲存至雲端資料庫！');
        }

        const currentQuoteNo = saveResult.quoteNo;
        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('報價單', {
            pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.25, right: 0.25, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } }
        });
        
        ws.columns = [ 
            { width: 25 }, 
            { width: 70 },  
            { width: 20 }, 
            { width: 20 }, 
            { width: 15 }, 
            { width: 30 }  
        ];

        if (showTitle) {
            ws.mergeCells('A1:F2');
            const titleCell = ws.getCell('A1');
            titleCell.value = displayTitle;
            titleCell.font = { name: '微軟正黑體', size: 26, bold: true, color: { argb: 'FF1C1C1E' } };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
        } else {
            ws.addRow([]); 
        }

        ws.addRow([]); 
        
        const infoRow1 = ws.addRow([]);
        const infoRow2 = ws.addRow([]);
        
        ws.mergeCells(`A${infoRow1.number}:D${infoRow2.number}`);
        ws.getCell(`A${infoRow1.number}`).value = `客戶名稱：${clientName}`; 
        ws.getCell(`A${infoRow1.number}`).font = { name: '微軟正黑體', size: 15, bold: true };
        ws.getCell(`A${infoRow1.number}`).alignment = { vertical: 'middle', horizontal: 'left' };

        ws.mergeCells(`E${infoRow1.number}:F${infoRow1.number}`);
        ws.getCell(`E${infoRow1.number}`).value = `報價單號：${currentQuoteNo}`;
        ws.getCell(`E${infoRow1.number}`).font = { name: '微軟正黑體', size: 15, bold: true };
        ws.getCell(`E${infoRow1.number}`).alignment = { vertical: 'middle', horizontal: 'left' };

        const d = new Date();
        ws.mergeCells(`E${infoRow2.number}:F${infoRow2.number}`);
        ws.getCell(`E${infoRow2.number}`).value = `報價日期：${d.toLocaleDateString('zh-TW')}`;
        ws.getCell(`E${infoRow2.number}`).font = { name: '微軟正黑體', size: 15, bold: true };
        ws.getCell(`E${infoRow2.number}`).alignment = { vertical: 'middle', horizontal: 'left' };

        ws.addRow([]);

        const headerRow = ws.addRow(['類別', '項目明細', '單價', '數量', '天數', '項目小計']);
        headerRow.height = 42;
        headerRow.eachCell((cell) => {
            cell.font = { name: '微軟正黑體', bold: true, size: 15, color: { argb: 'FFFFFFFF' } }; 
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C1C1E' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' }; 
            cell.border = { top: {style:'medium'}, left: {style:'medium'}, bottom: {style:'medium'}, right: {style:'medium'} };
        });

        const sortedQuoteList = [...quoteList].sort((a, b) => {
            const dbA = engineeringDB.find(db => db.id === a.dbId), dbB = engineeringDB.find(db => db.id === b.dbId);
            if(!dbA || !dbB) return 0;
            const indexA = systemCategories.indexOf(dbA.category);
            const indexB = systemCategories.indexOf(dbB.category);
            if (indexA !== indexB) return indexA - indexB;
            return dbA.name.localeCompare(dbB.name);
        });

        let isEvenRow = true;
        sortedQuoteList.forEach(qItem => {
            const dbItem = engineeringDB.find(db => db.id === qItem.dbId); if (!dbItem) return;
            let subtotal = Math.max(0, (qItem.price * qItem.qty * (dbItem.hasDays ? qItem.days : 1)) - (qItem.discount || 0));
            
            const hasUnit = dbItem.unit && dbItem.unit.trim() !== '';
            const hideUnitDisplay = qItem.hideUnit || !hasUnit;
            const unitStr = hideUnitDisplay ? `${qItem.qty}` : `${qItem.qty} ${dbItem.unit}`;
            
            let itemNameText = dbItem.name;
            if (qItem.discount && qItem.discount > 0) {
                itemNameText += `\n(優惠折抵: -$${qItem.discount.toLocaleString()})`;
            }
            
            const row = ws.addRow([ dbItem.category, itemNameText, qItem.price, unitStr, dbItem.hasDays ? `${qItem.days} 天` : '-', subtotal ]);
            
            row.height = (qItem.discount && qItem.discount > 0) ? 48 : 36;
            const bg = isEvenRow ? 'FFFFFFFF' : 'FFF2F2F7'; isEvenRow = !isEvenRow;

            row.eachCell({ includeEmpty: true }, (cell, colIdx) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } }; 
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                cell.font = { name: '微軟正黑體', size: 14, bold: true, color: { argb: 'FF1C1C1E' } };
                if(colIdx===1) { cell.alignment={horizontal:'center', vertical:'middle'}; cell.font={name:'微軟正黑體', bold:true, color:{argb:'FF0A7AFF'}}; }
                else if(colIdx===2) { cell.alignment={horizontal:'left', vertical:'middle', indent:1, wrapText: true}; } 
                else { cell.alignment={horizontal:'center', vertical:'middle'}; if(colIdx===3||colIdx===6) cell.numFmt='#,##0'; }
            });
        });

        ws.addRow([]); 
        const tRow = ws.addRow(['總計金額：', '', '', '', '', currentGrandTotal]); 
        tRow.height = 50;
        
        ws.mergeCells(`A${tRow.number}:E${tRow.number}`);
        tRow.getCell(1).font = { name: '微軟正黑體', size: 20, bold: true }; 
        tRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
        tRow.getCell(6).font = { name: 'Arial', size: 24, bold: true, color: { argb: 'FFFF3B30' } }; 
        tRow.getCell(6).alignment = { horizontal: 'right', vertical: 'middle' };
        tRow.getCell(6).numFmt = '"NT$" #,##0';

        const borderStyle = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'double', color: { argb: 'FFFF3B30' }}, right: {style:'thin'} };
        tRow.getCell(1).border = borderStyle;
        tRow.getCell(6).border = borderStyle;

        const buf = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `${currentQuoteNo}_${clientName}.xlsx`);
    };

    document.getElementById('secret-trigger').addEventListener('click', () => {
        secretClickCount++; clearTimeout(secretTimer);
        if (secretClickCount >= 3) { document.getElementById('nav-tabs').style.display = 'flex'; switchView('back'); secretClickCount = 0; }
        secretTimer = setTimeout(() => { secretClickCount = 0; }, 1000);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => { console.log('SW 未就緒。'); }); });
    }
</script>
