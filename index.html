    window.importDBFromExcel = function(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const workbook = new ExcelJS.Workbook();
                await workbook.xlsx.load(e.target.result); 
                
                const ws = workbook.getWorksheet('工程資料庫') || workbook.getWorksheet('資料庫設定');
                if(!ws) return alert('⚠️ 找不到資料工作表，請確定這是系統匯出的 Excel 檔案。');

                let newDB = [];
                let hasOldIdColumn = String(ws.getCell('A1').value || '').includes('識別碼');

                const getVal = (row, idx) => {
                    let cell = row.getCell(idx).value;
                    if (cell !== null && typeof cell === 'object') {
                        if (cell.richText) return cell.richText.map(t => t.text).join('').trim();
                        if (cell.formula) return String(cell.result || '').trim();
                        if (cell.text) return String(cell.text).trim();
                    }
                    return cell !== null && cell !== undefined ? String(cell).trim() : '';
                };

                ws.eachRow((row, rowNumber) => {
                    if (rowNumber === 1) return; 

                    let catCell, nameCell, unitCell, hasDaysCell;
                    if (hasOldIdColumn) {
                        catCell = getVal(row, 2); nameCell = getVal(row, 3); unitCell = getVal(row, 4); hasDaysCell = getVal(row, 5);
                    } else {
                        catCell = getVal(row, 1); nameCell = getVal(row, 2); unitCell = getVal(row, 3); hasDaysCell = getVal(row, 4);
                    }

                    if (!catCell && !nameCell) return;

                    newDB.push({
                        id: 'id_' + Date.now() + Math.random().toString(36).substr(2, 5),
                        category: catCell || '未分類',
                        name: nameCell || '未命名',
                        unit: unitCell || '',
                        hasDays: String(hasDaysCell).toUpperCase() === 'TRUE' || hasDaysCell === '1' || hasDaysCell === '是',
                        defaultHideUnit: false
                    });
                });

                let newCats = [];
                const ws2 = workbook.getWorksheet('系統分類管理');
                if (ws2) {
                    ws2.eachRow((row, rowNumber) => {
                        if (rowNumber === 1) return;
                        let c = getVal(row, 1);
                        if (c) newCats.push(c);
                    });
                }
                
                if (newCats.length === 0) {
                    newDB.forEach(item => { if(!newCats.includes(item.category)) newCats.push(item.category); });
                }

                if (newDB.length > 0) {
                    if (!confirm(`即將以匯入檔覆蓋雲端資料庫（${newDB.length} 筆項目），確定要繼續嗎？\n（系統會先自動備份當日原資料）`)) return;
                    const r = await safeMutate((state) => {
                        state.items = newDB;
                        if (newCats.length > 0) state.categories = newCats;
                    });
                    if (!r) return;
                    categoriesDirty = false;
                    systemCategories = r.state.categories;
                    window.updateCategoryUI();
                    window.renderAdminView();
                    alert(`✅ 成功匯入並覆蓋 ${newDB.length} 筆資料！`);
                } else {
                    alert('⚠️ 匯入失敗，未讀取到任何有效資料。');
                }
            } catch(error) {
                console.error("Excel匯入失敗詳細錯誤:", error);
                alert("❌ 匯入失敗，請確認檔案格式是否正確。");
            } finally {
                document.getElementById('importDBInput').value = ''; 
            }
        };
        reader.readAsArrayBuffer(file);
    };

                            var guard = setTimeout(function() { if (!done) { done = true; fail('逾時，請重新整理後再試'); } }, 45000);
                            html2canvas(target, { scale: scale, useCORS: true, allowTaint: true, backgroundColor: '#ffffff', logging: false, scrollX: 0, scrollY: 0 }).then(function(canvas) {
                                if (done) return; done = true; clearTimeout(guard);
                                var imgData = canvas.toDataURL('image/png');
                                loading.style.display = 'none';
                                document.getElementById('action-center').style.display = 'none';
                                target.style.display = 'none';
                                document.getElementById('result-area').style.display = 'flex';
                                document.getElementById('result-img').src = imgData;
                                window.scrollTo(0, 0);
                                var dlBtn = document.getElementById('btn-download');
                                if (dlBtn) {
                                    dlBtn.onclick = function() {
                                        var a = document.createElement('a');
                                        a.href = imgData;
                                        a.download = fileName + '.png';
                                        a.click();
                                    };
                                }
                            }).catch(function(err) {
                                if (done) return; done = true; clearTimeout(guard);
                                fail((err && err.message) || err);
                            });
                        }, 500);
                    });
                })();
            <\/script>
        </body></html>`);
        newWin.document.close();

        // 雲端儲存（含逾時保護：離線/網路卡住時不會無限等待）
        let saveResult;
        try {
            saveResult = await Promise.race([
                window.recordQuoteHistory(),
                new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))
            ]);
        } catch (e) {
            try { newWin.close(); } catch (_) {}
            return alert('❌ 報價紀錄儲存逾時或失敗，請確認網路後重試。');
        }
        if (!saveResult || saveResult.status === 'error') { try { newWin.close(); } catch (_) {} return; }
        if (saveResult.status === 'duplicate') alert('系統提示：此筆報價明細已成功儲存過，將直接為您匯出圖片！\n(單號：' + saveResult.quoteNo + ')');
        const fname = `${saveResult.quoteNo}_${clientName}`.replace(/[\\\/:*?"<>|'`$]/g, '_');
        try { newWin.__setQuoteNo(saveResult.quoteNo, fname); } catch (e) { console.warn('回填單號失敗', e); }
    };

    window.exportToExcelFormatted = async function() {
        const clientName = document.getElementById('client-name-input').value.trim();
        if (!clientName) { alert('請輸入「客戶名稱」！'); document.getElementById('client-name-input').focus(); return; }
        if (quoteList.length === 0) return alert('請加入工程項目！');
        if (!confirm('確認要送出該完工報價單並產出 Excel 嗎？')) return;

        const showTitle = document.getElementById('show-title-cb').checked;
        const customTitleInput = document.getElementById('quote-title-input').value.trim();
        const displayTitle = customTitleInput !== '' ? customTitleInput : '劉氏工程 — 完工報價單';
        const clientAddress = document.getElementById('client-address-input').value.trim();
        const clientTaxId = document.getElementById('client-taxid-input').value.trim();
        const projectName = document.getElementById('project-name-input').value.trim();
        const taxExcluded = document.getElementById('tax-excluded-cb').checked;

        const saveResult = await window.recordQuoteHistory();
        if (saveResult.status === 'error') return;
        
        if (saveResult.status === 'duplicate') {
            alert('系統提示：此筆報價明細已成功儲存過，將直接為您匯出檔案！\n(單號：' + saveResult.quoteNo + ')');
        } else {
            alert('報價紀錄已成功產生單號並同步儲存至雲端資料庫！');
        }

        const currentQuoteNo = saveResult.quoteNo;
        const workbook = new ExcelJS.Workbook();
        const ws = workbook.addWorksheet('報價單', {
            pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0, margins: { left: 0.25, right: 0.25, top: 0.75, bottom: 0.75, header: 0.3, footer: 0.3 } }
        });
        
        ws.columns = [ 
            { width: 25 }, 
            { width: 70 },  
            { width: 20 }, 
            { width: 20 }, 
            { width: 15 }, 
            { width: 30 }  
        ];

        if (showTitle) {
            ws.mergeCells('A1:F2');
            const titleCell = ws.getCell('A1');
            titleCell.value = displayTitle;
            titleCell.font = { name: '微軟正黑體', size: 26, bold: true, color: { argb: 'FF1C1C1E' } };
            titleCell.alignment = { vertical: 'middle', horizontal: 'center' };
        } else {
            ws.addRow([]); 
        }

        ws.addRow([]); 
        
        const d = new Date();
        const leftInfoLines = [`客戶名稱：${clientName}`];
        if (clientAddress) leftInfoLines.push(`客戶地址：${clientAddress}`);
        if (clientTaxId) leftInfoLines.push(`統一編號：${clientTaxId}`);
        const rightInfoLines = [`報價單號：${currentQuoteNo}`, `報價日期：${d.toLocaleDateString('zh-TW')}`];
        const infoRowCount = Math.max(leftInfoLines.length, rightInfoLines.length);
        const infoRows = [];
        for (let i = 0; i < infoRowCount; i++) infoRows.push(ws.addRow([]));
        ws.mergeCells(`A${infoRows[0].number}:D${infoRows[infoRowCount - 1].number}`);
        ws.getCell(`A${infoRows[0].number}`).value = leftInfoLines.join('\n');
        ws.getCell(`A${infoRows[0].number}`).font = { name: '微軟正黑體', size: 15, bold: true };
        ws.getCell(`A${infoRows[0].number}`).alignment = { vertical: 'top', horizontal: 'left', wrapText: true };
        infoRows.forEach((row, i) => {
            row.height = 24;
            if (rightInfoLines[i]) {
                ws.mergeCells(`E${row.number}:F${row.number}`);
                ws.getCell(`E${row.number}`).value = rightInfoLines[i];
                ws.getCell(`E${row.number}`).font = { name: '微軟正黑體', size: 15, bold: true };
                ws.getCell(`E${row.number}`).alignment = { vertical: 'middle', horizontal: 'left' };
            }
        });

        if (projectName) {
            const projRow = ws.addRow([]);
            ws.mergeCells(`A${projRow.number}:F${projRow.number}`);
            ws.getCell(`A${projRow.number}`).value = `工程名稱：${projectName}`;
            ws.getCell(`A${projRow.number}`).font = { name: '微軟正黑體', size: 15, bold: true, color: { argb: 'FF1C1C1E' } };
            ws.getCell(`A${projRow.number}`).alignment = { vertical: 'middle', horizontal: 'left' };
            ws.getCell(`A${projRow.number}`).border = { top: { style: 'thin', color: { argb: 'FFC7C7CC' } } };
            projRow.height = 26;
        }

        ws.addRow([]);

        const headerRow = ws.addRow(['類別', '項目明細', '單價', '數量', '天數', '項目小計']);
        headerRow.height = 42;
        headerRow.eachCell((cell) => {
            cell.font = { name: '微軟正黑體', bold: true, size: 15, color: { argb: 'FFFFFFFF' } }; 
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C1C1E' } };
            cell.alignment = { vertical: 'middle', horizontal: 'center' }; 
            cell.border = { top: {style:'medium'}, left: {style:'medium'}, bottom: {style:'medium'}, right: {style:'medium'} };
        });

        const sortedQuoteList = [...quoteList].sort((a, b) => {
            const dbA = engineeringDB.find(db => db.id === a.dbId), dbB = engineeringDB.find(db => db.id === b.dbId);
            if(!dbA || !dbB) return 0;
            const indexA = systemCategories.indexOf(dbA.category);
            const indexB = systemCategories.indexOf(dbB.category);
            if (indexA !== indexB) return indexA - indexB;
            return dbA.name.localeCompare(dbB.name);
        });

        let isEvenRow = true;
        sortedQuoteList.forEach(qItem => {
            const dbItem = engineeringDB.find(db => db.id === qItem.dbId); if (!dbItem) return;
            let subtotal = calcSubtotal(qItem, dbItem);
            const amt = hasAmount(qItem.price);
            
            const itemUnit = getItemUnit(qItem, dbItem);
            const hasUnit = itemUnit && itemUnit.trim() !== '';
            const hideUnitDisplay = qItem.hideUnit || !hasUnit;
            const unitStr = hideUnitDisplay ? `${qItem.qty}` : `${qItem.qty} ${itemUnit}`;
            
            let itemNameText = dbItem.name;
            let extraLines = 0;
            if (amt && qItem.discount && qItem.discount > 0) {
                itemNameText += `\n(優惠折抵: -$${qItem.discount.toLocaleString()})`;
                extraLines += 1;
            }
            const remarkText = (qItem.remark || '').trim();
            if (remarkText) {
                itemNameText += `\n備註：${remarkText}`;
                // 估算備註換行數（欄寬約 32 個中文字一行）
                extraLines += estTextLines('備註：' + remarkText, amt ? 60 : 140);
            }
            
            const row = amt
                ? ws.addRow([ dbItem.category, itemNameText, qItem.price, unitStr, dbItem.hasDays ? `${qItem.days} 天` : '-', subtotal ])
                : ws.addRow([ dbItem.category, itemNameText, '', '', '', '' ]);   // 沒有金額：只顯示項目名稱
            if (!amt) ws.mergeCells(`B${row.number}:F${row.number}`);
            
            extraLines += estTextLines(dbItem.name, amt ? 60 : 140) - 1;   // 項目名稱本身過長折行
            row.height = Math.max(36, 24 + extraLines * 22);
            const bg = isEvenRow ? 'FFFFFFFF' : 'FFF2F2F7'; isEvenRow = !isEvenRow;

            row.eachCell({ includeEmpty: true }, (cell, colIdx) => {
                cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: bg } }; 
                cell.border = { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
                cell.font = { name: '微軟正黑體', size: 14, bold: true, color: { argb: 'FF1C1C1E' } };
                if(colIdx===1) { cell.alignment={horizontal:'center', vertical:'middle'}; cell.font={name:'微軟正黑體', bold:true, color:{argb:'FF0A7AFF'}}; }
                else if(colIdx===2) { cell.alignment={horizontal:'left', vertical:'middle', indent:1, wrapText: true}; } 
                else { cell.alignment={horizontal:'center', vertical:'middle'}; if(colIdx===3||colIdx===6) cell.numFmt='#,##0'; }
            });
        });

        ws.addRow([]); 
        const styleTotalRow = (row, labelSize, numSize, isFinal) => {
            row.height = isFinal ? 50 : 32;
            ws.mergeCells(`A${row.number}:E${row.number}`);
            row.getCell(1).font = { name: '微軟正黑體', size: labelSize, bold: true };
            row.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
            row.getCell(6).font = { name: 'Arial', size: numSize, bold: true, color: { argb: 'FFFF3B30' } };
            row.getCell(6).alignment = { horizontal: 'right', vertical: 'middle' };
            row.getCell(6).numFmt = '"NT$" #,##0';
            const bs = isFinal
                ? { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'double', color: { argb: 'FFFF3B30' }}, right: {style:'thin'} }
                : { top: {style:'thin'}, left: {style:'thin'}, bottom: {style:'thin'}, right: {style:'thin'} };
            row.getCell(1).border = bs;
            row.getCell(6).border = bs;
        };
        if (taxExcluded) {
            const taxAmount = Math.round(currentGrandTotal * 0.05);
            const noteRow = ws.addRow(['以上金額皆為未稅']);
            ws.mergeCells(`A${noteRow.number}:F${noteRow.number}`);
            noteRow.getCell(1).font = { name: '微軟正黑體', size: 13, bold: true, color: { argb: 'FF8E8E93' } };
            noteRow.getCell(1).alignment = { horizontal: 'right', vertical: 'middle' };
            styleTotalRow(ws.addRow(['總計：', '', '', '', '', currentGrandTotal]), 15, 16, false);
            styleTotalRow(ws.addRow(['稅額：', '', '', '', '', taxAmount]), 15, 16, false);
            styleTotalRow(ws.addRow(['總計金額：', '', '', '', '', currentGrandTotal + taxAmount]), 20, 24, true);
        } else {
            styleTotalRow(ws.addRow(['總計金額：', '', '', '', '', currentGrandTotal]), 20, 24, true);
        }
        const finalAmount = taxExcluded ? currentGrandTotal + Math.round(currentGrandTotal * 0.05) : currentGrandTotal;
        const chineseRow = ws.addRow([`總計新台幣${numberToChineseUpper(finalAmount)}元整`]);
        ws.mergeCells(`A${chineseRow.number}:F${chineseRow.number}`);
        chineseRow.getCell(1).font = { name: '微軟正黑體', size: 15, bold: true, color: { argb: 'FF1C1C1E' } };
        chineseRow.getCell(1).alignment = { horizontal: 'center', vertical: 'middle' };
        chineseRow.height = 30;

        const buf = await workbook.xlsx.writeBuffer();
        saveAs(new Blob([buf]), `${currentQuoteNo}_${clientName}.xlsx`.replace(/[\\\/:*?"<>|]/g, '_'));
    };

    let secretClickCount = 0; let secretTimer;
    document.getElementById('secret-trigger').addEventListener('click', () => {
        secretClickCount++; clearTimeout(secretTimer);
        if (secretClickCount >= 3) { document.getElementById('nav-tabs').style.display = 'flex'; switchView('back'); secretClickCount = 0; }
        secretTimer = setTimeout(() => { secretClickCount = 0; }, 1000);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
                reg.update().catch(() => {});
                document.addEventListener('visibilitychange', () => {
                    if (document.visibilityState === 'visible') reg.update().catch(() => {});
                });
            }).catch(err => { console.log('SW 未就緒。'); });
        });
    }
</script>
<script>
/* UI 動態裝飾（純視覺：標頭聚光、卡片游標光感、按鈕波紋、捲動進度條；不讀寫任何報價資料） */
(function () {
    try {
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // 數字欄位點入時自動全選，免去先刪除預設 0/1 再輸入的步驟（純輸入便利，不改資料）
        document.addEventListener('focusin', function (e) {
            try { var t = e.target; if (t && t.tagName === 'INPUT' && t.type === 'number' && t.closest('.quote-item-row')) setTimeout(function () { try { t.select(); } catch (_) {} }, 0); } catch (_) {}
        });
        if (reduce) return;
        var raf = 0, lastEvt = null;
        var spotSel = '.header, .cat-btn, .selectable-item, .history-card';
        document.addEventListener('pointermove', function (e) {
            if (e.pointerType === 'touch') return;
            lastEvt = e;
            if (raf) return;
            raf = requestAnimationFrame(function () {
                raf = 0;
                var t = lastEvt && lastEvt.target && lastEvt.target.closest ? lastEvt.target.closest(spotSel) : null;
                if (!t) return;
                var r = t.getBoundingClientRect();
                if (t.classList.contains('header')) {
                    t.style.setProperty('--mx', ((lastEvt.clientX - r.left) / r.width * 100).toFixed(1) + '%');
                    t.style.setProperty('--my', ((lastEvt.clientY - r.top) / r.height * 100).toFixed(1) + '%');
                } else {
                    t.style.setProperty('--px', (lastEvt.clientX - r.left) + 'px');
                    t.style.setProperty('--py', (lastEvt.clientY - r.top) + 'px');
                }
            });
        }, { passive: true });


        // ── v6 動態：標頭光點 + 總金額數字滾動（純視覺，不改任何資料；失敗不影響功能）
        try {
            var hd = document.querySelector('.header');
            if (hd) {
                ['fx-orb fx-orb-a', 'fx-orb fx-orb-b', 'fx-orb fx-orb-c', 'fx-ring', 'fx-ring fx-ring-2', 'fx-scan', 'fx-edge'].forEach(function (c) {
                    var el = document.createElement('span'); el.className = c; hd.appendChild(el);
                });
                var dn = window.innerWidth >= 700 ? 18 : 9;
                for (var di = 0; di < dn; di++) {
                    var dot = document.createElement('span');
                    dot.className = 'fx-dot';
                    var sz = 2 + Math.random() * 4;
                    dot.style.left = (Math.random() * 100).toFixed(1) + '%';
                    dot.style.width = dot.style.height = sz.toFixed(1) + 'px';
                    dot.style.animationDuration = (7 + Math.random() * 8).toFixed(1) + 's';
                    dot.style.animationDelay = (-Math.random() * 12).toFixed(1) + 's';
                    hd.appendChild(dot);
                }
            }
            var tot = document.getElementById('grand-total-display');
            if (tot && window.MutationObserver) {
                var num = function () { return parseInt((tot.textContent || '0').replace(/[^0-9]/g, ''), 10) || 0; };
                var shown = num(), rafId = 0;
                new MutationObserver(function () {
                    var target = num();
                    if (target === shown) return;
                    var from = shown, t0 = performance.now(), dur = 520;
                    cancelAnimationFrame(rafId);
                    (function step(now) {
                        var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
                        var v = p >= 1 ? target : Math.round(from + (target - from) * e);
                        tot.textContent = v.toLocaleString();
                        shown = v;
                        if (p < 1) rafId = requestAnimationFrame(step);
                    })(t0);
                }).observe(tot, { childList: true, characterData: true, subtree: true });
            }
        } catch (_) {}

        var rippleSel = '.top-action-btn, .cat-btn, .btn-text, .action-circle-btn, .tab-btn, .qty-btn, .selectable-item';
        document.addEventListener('pointerdown', function (e) {
            try {
                var el = e.target && e.target.closest ? e.target.closest(rippleSel) : null;
                if (!el || el.disabled) return;
                var cs = getComputedStyle(el);
                if (cs.position === 'static') el.style.position = 'relative';
                if (cs.overflow === 'visible') el.style.overflow = 'hidden';
                var r = el.getBoundingClientRect();
                var s = document.createElement('span');
                s.className = 'fx-ripple';
                s.style.left = (e.clientX - r.left) + 'px';
                s.style.top = (e.clientY - r.top) + 'px';
                el.appendChild(s);
                setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 700);
            } catch (_) {}
        }, { passive: true });

        var bar = document.createElement('div');
        bar.id = 'fx-progress';
        document.body.appendChild(bar);
        var ticking = false;
        function updateBar() {
            ticking = false;
            var sc = document.getElementById('main-scroll-container');
            var h = sc ? sc.scrollHeight - sc.clientHeight : 0;
            var y = sc ? sc.scrollTop : 0;
            bar.style.transform = 'scaleX(' + (h > 0 ? Math.min(1, y / h) : 0) + ')';
        }
        (document.getElementById('main-scroll-container') || window).addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(updateBar); } }, { passive: true });
        updateBar();
    } catch (err) { /* 裝飾效果失敗不影響主功能 */ }
})();
</script>
